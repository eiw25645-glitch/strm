<meta name="theme-color" content="#ffffff">

<style>
:root{color-scheme:light;--bg:#fff;--tx:#1d1c21;--mu:#6b6a73;--ln:#d6dae1;--sf:#eef5fb;--y:#fae469;--on:#1d1c21}
html[data-theme=dark]{color-scheme:dark;--bg:#000;--tx:#fdfefd;--mu:#a6a5ad;--ln:#34333a;--sf:#1a1a1f}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--tx)}
body{font-family:"Rubik","Anuphan",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);display:grid;place-items:center;cursor:pointer;text-decoration:none;font:600 12px "Rubik","Anuphan",sans-serif;flex:none;padding:0}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.idc{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
.ida{display:flex;gap:10px;max-width:380px;margin:16px auto 0}
.btn{flex:1;border:1px solid transparent;border-radius:99px;padding:13px 8px;font:700 14px "Rubik","Anuphan",sans-serif;background:var(--y);color:var(--on);cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.soft{background:transparent;color:var(--tx);border-color:var(--ln)}
.btn:active{transform:scale(.96)}
.msg{max-width:380px;margin:40px auto;text-align:center;border:1px solid var(--ln);border-radius:22px;padding:24px 20px;background:var(--sf)}
.msg p{color:var(--mu);line-height:1.6;margin-bottom:16px}
.msg .btn{display:inline-block;padding:13px 28px}
[hidden]{display:none!important}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:14px;z-index:9;max-width:90%}
:focus-visible{outline:2px solid #4a8ef0;outline-offset:2px}
/* ===== MOBILE FIX: วางไว้ท้ายสุดของ <style> ในทุกหน้า ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation}
body{overflow-x:hidden;max-width:100%}
*,*::before,*::after{box-sizing:border-box}
img,svg,canvas,video{max-width:100%}

/* ช่องกรอกทุกชนิด: ฟอนต์ 16px ขึ้นไป = iOS ไม่ซูมตอนแตะ */
input,select,textarea{
  font-size:16px!important;
  width:100%;max-width:100%;min-width:0;
}
input,select,textarea,button{touch-action:manipulation}

/* ช่องวันที่/เวลา: ตัดสไตล์เนทีฟของ iOS ที่ทำให้ช่องกว้างเกิน */
input[type=date],input[type=time],input[type=month],input[type=week],input[type=datetime-local]{
  -webkit-appearance:none;appearance:none;
  display:block;width:100%;min-width:0;max-width:100%;
  min-height:48px;line-height:1.2;
  text-align:left;
}
input[type=date]::-webkit-date-and-time-value,
input[type=time]::-webkit-date-and-time-value,
input[type=datetime-local]::-webkit-date-and-time-value{
  text-align:left;margin:0;min-height:1.2em;
}
input[type=date]::-webkit-datetime-edit,
input[type=time]::-webkit-datetime-edit{padding:0}

/* ปุ่ม/ลิงก์ให้กดง่ายด้วยนิ้ว */
button,.btn,[role=button]{min-height:44px}

/* แถวที่ใช้ grid/flex: กันลูกดันกว้างเกินกรอบ */
.row>*,.grid>*,form>*{min-width:0}

/* ---------- Certificate page (own page, follows theme, save as image) ---------- */
let drawGen = 0;
async function drawId(u) {
  const cv = document.getElementById('idc'); if (!cv || !u) return;
  const my = ++drawGen, dark = document.documentElement.dataset.theme === 'dark';
  const W = 640, H = 960, x = cv.getContext('2d'); cv.width = W; cv.height = H;
  try { await Promise.all([document.fonts.load('800 40px Rubik'), document.fonts.load('500 24px Rubik')]); } catch {}
  if (my !== drawGen) return;
  const F = 'Rubik, Anuphan, system-ui, sans-serif', Y = '#fae469', B = '#89cefa', ON = '#1d1c21';
  const BG = dark ? '#000000' : '#ffffff', TX = dark ? '#fdfefd' : '#1d1c21', MU = dark ? '#a6a5ad' : '#6b6a73', LN = dark ? '#3a3940' : '#d9dde3', SF = dark ? '#26252b' : '#ffffff';
  const rr = (a, b, w, h, r) => { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); };
  const txt = (s, px, py, font, col, al = 'left') => { x.font = font; x.fillStyle = col; x.textAlign = al; x.fillText(s, px, py); };
  const line = (x1, y1, x2, y2) => { x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.lineWidth = 1; x.strokeStyle = LN; x.stroke(); };
  const star = (cx, cy, r, col, rot = 0) => { x.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + (Math.PI / 5) * i - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; x[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); } x.closePath(); x.fillStyle = col; x.fill(); };
  // ===== minimal cute certificate: thin lines, tiger stickers =====
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  rr(16, 16, W - 32, H - 32, 32); x.lineWidth = 1; x.strokeStyle = LN; x.stroke();
  let sk = {}, ph = null;
  try { const r = await Promise.all([loadImg(STK.folder), loadImg(STK.melon), loadImg(STK.mk)]); sk = { folder: r[0], melon: r[1], mk: r[2] }; } catch {}
  try { ph = await loadImg(getPic(u) || avUri(u)); } catch {}
  if (my !== drawGen) return;
  const img = (im, a, b, w) => { if (im) x.drawImage(im, a, b, w, w * im.height / im.width); };
  // header
  img(sk.folder, 44, 38, 66);
  txt('MOLO#2 STRM HUB', 126, 72, `800 27px ${F}`, TX);
  txt('Certificate of Streaming', 126, 100, `500 16px ${F}`, MU);
  line(48, 126, W - 48, 126);
  // photo / avatar in a round frame
  const cx = 320, cy = 292, R = 118;
  x.beginPath(); x.arc(cx, cy, R + 8, 0, 7); x.fillStyle = Y; x.fill();
  x.save(); x.beginPath(); x.arc(cx, cy, R, 0, 7); x.clip(); x.fillStyle = SF; x.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  if (ph) { const k = Math.max(2 * R / ph.width, 2 * R / ph.height), w = ph.width * k, h = ph.height * k; x.drawImage(ph, cx - w / 2, cy - R - (h - 2 * R) * 0.25, w, h); }
  x.restore();
  img(sk.melon, 396, 322, 150);
  star(112, 214, 11, Y, 0.3); star(530, 196, 8, B, -0.2);
  // title + name + level
  x.save(); try { x.letterSpacing = '3px'; } catch {} txt('CERTIFIED STREAMER', W / 2, 484, `700 14px ${F}`, MU, 'center'); x.restore();
  let nm = '@' + String(u.username || '').replace(/^@/, ''), fs = 40;
  while (fs > 20) { x.font = `800 ${fs}px ${F}`; if (x.measureText(nm).width <= W - 100) break; fs -= 2; }
  txt(nm, W / 2, 536, `800 ${fs}px ${F}`, TX, 'center');
  const lv = `${LV_ICON[Math.min(Math.max(u.level, 1), 10) - 1]}  LV.${u.level} · ${lvName(u.level)}`; x.font = `700 22px ${F}`;
  const pw = x.measureText(lv).width + 44; rr(W / 2 - pw / 2, 560, pw, 48, 24); x.fillStyle = Y; x.fill(); txt(lv, W / 2, 592, `700 22px ${F}`, ON, 'center');
  // stats: plain text + thin lines
  const fl = [['STREAK', `${u.streak ?? 0} days`], ['HOURS', String(u.totalHours ?? 0)], ['BADGES', String((u.badges || []).length)], ['EXP', `${u.exp} / ${u.nextExp ?? '—'}`]];
  line(48, 648, W - 48, 648); line(48, 730, W - 48, 730); line(48, 812, W - 48, 812);
  fl.forEach(([l, v], i) => {
    const fx = 48 + (i % 2) * 284, fy = 648 + Math.floor(i / 2) * 82;
    txt(l, fx, fy + 30, `700 15px ${F}`, MU); txt(v, fx, fy + 62, `800 25px ${F}`, TX);
  });
  // footer: id + tagline, I love mk sticker as the stamp
  txt('ID ' + (String(u.id || '').replace(/[^\w]/g, '').slice(0, 6).toUpperCase() || '—'), 48, 884, `700 15px ${F}`, MU);
  txt('Stream together, grow together.', 48, 914, `500 18px ${F}`, TX);
  if (sk.mk) { x.save(); x.translate(556, 874); x.rotate(-0.2); x.drawImage(sk.mk, -44, -44, 88, 88); x.restore(); }
}
window.saveId = () => {
  const cv = document.getElementById('idc'); if (!cv) return;
  cv.toBlob(async (b) => {
    const f = new File([b], 'molo2-certificate.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'molo2-certificate.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
};


let U = null;

/* ---- page ---- */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paint() {
  document.documentElement.lang = lang;
  document.documentElement.dataset.theme = theme;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = theme === 'light' ? '#ffffff' : '#000000';
  $('#ttl').textContent = tr('ttl'); document.title = tr('ttl') + ' · MOLO#2 STRM HUB';
  $('#lng').textContent = lang === 'th' ? 'EN' : 'TH';
  $('#thm').innerHTML = theme === 'light' ? MOON : SUN;
  $('#save').textContent = tr('save');
  $('#photo').textContent = U && getPic(U) ? tr('chg') : tr('add');
  if (U) drawId(U);
}
let MSG = null;
function showMsg(key, btnKey) {
  MSG = [key, btnKey];

$('#thm').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem('theme', theme); } catch {} paint(); };

$('#photo').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = async () => {
    const f = i.files && i.files[0]; if (!f || !U) return;
    try {
      const bmp = await createImageBitmap(f), sz = Math.min(bmp.width, bmp.height), c = document.createElement('canvas');
      c.width = c.height = 360;
      c.getContext('2d').drawImage(bmp, (bmp.width - sz) / 2, (bmp.height - sz) / 2, sz, sz, 0, 0, 360, 360);
      localStorage.setItem(picKey(U), c.toDataURL('image/jpeg', 0.85));   // same key the main site uses for the profile photo
      paint(); toast(tr('saved'));
    } catch { toast(tr('badImg')); }
  };
  i.click();
};

async function init() {
  paint();
  if (DEMO) U = { id: 'demo', username: 'molo2_listener', avatar: '🐰', exp: 600, level: 4, nextExp: 1000, streak: 5, totalHours: 12.5, badges: ['first', 'streak5', 'listener', 'dedicated'] };
  else {
    let tok = '', dev = '';
    try { tok = localStorage.getItem('tok') || ''; dev = localStorage.getItem('dev') || ''; } catch {}
    if (!tok) { showMsg('login', 'goLogin'); return; }
    try {
      const r = await fetch('/api/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok, 'x-device': dev }, body: JSON.stringify({ action: 'me' }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { try { localStorage.removeItem('tok'); } catch {} showMsg('login', 'goLogin'); return; }
      if (!r.ok || !j.user) throw new Error(j.error || 'error');
      U = j.user;
    } catch { showMsg('err', 'retry'); return; }
  }
  MSG = null; $('#idc').hidden = false; $('#ida').hidden = false; $('#msg').hidden = true;
  paint();
}
init();
</script>
</body>
</html>
