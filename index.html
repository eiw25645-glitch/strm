<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#141414;--mute:#5f6272;--blue:#2447d6;--blue2:#5b7bf0;--soft:#dde5ff;--card:#f5f7fc;--line:#e4e9f2;--ok:#2f8f63;--bad:#d63a30;--paper:#fff;--butter:#ffd84d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Rubik","Anuphan",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
header h1{font-size:17px;font-weight:800}header h1 b{color:var(--blue)}
header p{font-size:12px;color:var(--mute)}
.hgrow{flex:1}
.pill{border:0;background:var(--soft);color:#111;border-radius:99px;padding:8px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
main{flex:1;padding:18px 20px 110px}
h2{font-size:24px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;background:#fff}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card p{color:var(--mute);font-size:14px;line-height:1.5}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0;border-radius:26px;padding:22px}
.hero small{opacity:.85;font-size:12px}.hero .big{font-size:36px;font-weight:800;margin:4px 0 0}.hero .nm{font-size:17px;opacity:.95}
.bar{height:10px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden;margin:8px 0}
.hero .bar{background:rgba(255,255,255,.35)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.hero .bar i{background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:20px;padding:16px}
.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--mute);font-size:13px}.stat .e{font-size:22px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:99px;padding:14px;font:700 15px inherit;font-family:inherit;background:var(--blue);color:#fff;cursor:pointer;text-decoration:none;margin-top:12px}
.btn.soft{background:var(--soft);color:#111}.btn.w{background:#fff;color:#111;display:inline-block;width:auto;padding:14px 28px}
.btn:disabled{opacity:.5}
.tag{background:var(--soft);color:#111;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e3f4ec;color:var(--ok)}.tag.bad{background:#fbe6ec;color:var(--bad)}
.list>div{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:15px inherit;font-family:inherit;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{border:0;border-radius:99px;padding:10px 16px;font:600 14px inherit;font-family:inherit;background:var(--card);color:var(--mute)}.seg .on{background:var(--soft);color:#111}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:14px}
.chart div{flex:1;text-align:center;font-size:12px;color:var(--mute)}.chart i{display:block;background:var(--blue2);border-radius:10px 10px 4px 4px;min-height:6px;margin-bottom:6px}.chart .hi i{background:var(--blue)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;font-size:12px;margin-top:12px}.ach span{display:block;font-size:30px}.ach .lock{opacity:.3;filter:grayscale(1)}
.av{width:96px;height:96px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:48px;margin:6px auto 10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:0;font:600 10px inherit;font-family:inherit;color:var(--mute);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:20px}nav .on{color:#111}
.more{display:flex;gap:10px;justify-content:center;margin-top:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;z-index:9;max-width:90%}
.err{color:var(--bad);font-size:13px;margin-top:10px}
a{color:#111}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button,.btn,.tag,.pill{touch-action:manipulation}
.tag{display:inline-block}
h2,.big,header h1,.card h3{font-family:"Rubik","Anuphan",sans-serif;font-weight:400}
.hero .big{font-weight:400}
.btn,.pill,.tag,nav button,.seg button{transition:transform .12s ease,filter .12s,background .15s}
.btn:active,.pill:active,button.tag:active,a.tag:active,.seg button:active{transform:scale(.94)}
.btn:active{filter:brightness(.94)}
nav button:active{transform:scale(.86)}
.sk{background:linear-gradient(90deg,#f0f3f9 25%,#e6ecf6 37%,#f0f3f9 63%);background-size:400% 100%;animation:sh 1.2s ease infinite;border-radius:22px;margin-bottom:14px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ===== themes: dark (charcoal) + light (white); yellow + sky blue accents ===== */
:root{color-scheme:dark;--bg:#1d1c21;--sf:#26252b;--ln:#34333a;--tx:#fdfefd;--mu:#a6a5ad;--lk:#89cefa;--lkbg:rgba(137,206,250,.14);--lkbd:rgba(137,206,250,.3);--olc:#fae469;--y:#fae469;--y2:#fae469;--b:#89cefa;--on:#1d1c21;--inp:#26252b;--cov:#2d2c33;--lock:#2d2c33;--lockic:#5c6378;--nav:#17161a;--chart:#3a3942;--okbg:#1f3b36;--okfg:#8be8c4;--okbd:#2f5c52;--badbg:#3d2336;--badfg:#ff9ec7;--badbd:#7a3d62;--toastbg:#26252b;--toastfg:#fdfefd;--ring2:rgba(255,255,255,.14);--star:#fae469;--err:#ff8a8a;--ink:#fdfefd;--mute:#a6a5ad;--line:#34333a;--bd:1px solid #34333a}
html[data-theme=light]{color-scheme:light;--bg:#ffffff;--sf:#eef5fb;--ln:#d6e6f3;--tx:#1d1c21;--mu:#6b6a73;--lk:#1f6fb2;--lkbg:rgba(31,111,178,.09);--lkbd:rgba(31,111,178,.28);--olc:#1d1c21;--y2:#f2c500;--inp:#ffffff;--cov:#e1edf7;--lock:#e2ebf3;--lockic:#9aa9b8;--nav:#ffffff;--chart:#d3e3f1;--okbg:#e0f3e8;--okfg:#14683f;--okbd:#a9d9bf;--badbg:#fde6eb;--badfg:#a3202f;--badbd:#e59aa8;--toastbg:#1d1c21;--toastfg:#ffffff;--ring2:rgba(0,0,0,.1);--star:#e0b000;--err:#c4372d;--ink:#1d1c21;--mute:#6b6a73;--line:#d6e6f3;--bd:1px solid #d6e6f3}
html,body{background:var(--bg);color:var(--tx)}
h2,h3,b,.stat .n,.big{color:var(--tx)}
.card,.stat,.song,.pf,.ytc,.pill,.btn.soft{background:var(--sf);border-color:var(--ln)}
.pill,.pf{color:var(--tx)}
.toast{background:var(--toastbg);color:var(--toastfg);border-color:var(--ln)}
input,select,.login input{background:var(--inp);border-color:var(--ln);color:var(--tx)}
input:focus,select:focus{border-color:var(--olc)}
.stat .l,.sub,.card p,.song .vw,.ytc .vw,.pf em,.pf span,label{color:var(--mu)}
.login label{color:var(--tx)}
.list>div{border-bottom:1px dotted var(--ln)}
header h1 .chip{color:var(--tx)}header h1 .chip em,header h1 .chip::after{color:var(--star)}
html[data-theme=light] header h1 .chip em{color:var(--tx);background:var(--y);padding:0 7px;border-radius:9px}
.btn,.btn.sm{background:var(--y);color:var(--on)}
.btn.soft{background:var(--sf);color:var(--tx);border-color:var(--ln)}
.btn.w{background:var(--tx);color:var(--bg)}
.tag{background:var(--lkbg);color:var(--lk);border-color:var(--lkbd)}
.tag.ok{background:var(--okbg);color:var(--okfg);border-color:var(--okbd)}
.tag.bad{background:var(--badbg);color:var(--badfg);border:1px dashed var(--badbd)}
.tag.ol{background:transparent;color:var(--olc);border-color:var(--olc)}
a{color:var(--lk)}
.hero{background:var(--y);color:var(--on);border-color:rgba(0,0,0,.12)}.hero b,.hero h3,.hero .big,.hero small,.hero .nm{color:var(--on)}
.hero .bar{background:rgba(29,28,33,.18)}.hero .bar i{background:var(--on)}
.feat{background:var(--b);color:var(--on);border-color:rgba(0,0,0,.12)}.feat b,.feat p{color:var(--on)}.feat .tag{background:var(--on);color:#fdfefd}
.go{background:var(--on);color:#fdfefd}
.ico,.ach span{background:var(--b);border-color:var(--ring2)}
:is(.ico,.ach span):has([data-n=clock],[data-n=headphones],[data-n=cal]){background:var(--b)}
:is(.ico,.ach span):has([data-n=music]){background:var(--y)}
:is(.ico,.ach span):has([data-n=bolt],[data-n=medal],[data-n=spark],[data-n=crown],[data-n=trophy]){background:var(--y)}
:is(.ico,.ach span):has([data-n=flame]){background:var(--y)}
:is(.ico,.ach span):has([data-n=radio],[data-n=sprout]){background:var(--b)}
:is(.ico,.ach span):has([data-n=diamond]){background:var(--b)}
.ico.gr{background:var(--b)}
.feat .ico.ico{background:var(--on);border-color:transparent}
.ico svg,.ach span svg{color:var(--on)}
.feat .ico.ico svg{color:var(--y)}
.pill svg,.sec svg,.dt svg{color:var(--lk)}
.ach div.lock span{background:var(--lock)}.ach div.lock span svg{color:var(--lockic)}
.av{background:var(--y);border-color:var(--ring2)}
.bar{background:var(--ln)}.bar i{background:var(--y2)}
.chart i{background:var(--chart)}.chart .hi i{background:var(--y2)}
.sec::before{color:var(--star)}
.seg button{background:var(--sf);color:var(--mu)}.seg .on{background:var(--y);color:var(--on)}
.lvc.cur{background:var(--y)}.lvc.cur b{color:var(--on)}.lvc.lock b{color:var(--mu)}.lvq{color:var(--lk)}
nav{background:var(--nav);border-top-color:var(--ln)}nav button{color:var(--mu)}nav .on{background:var(--y);color:var(--on)}
.cov,.ytv{background:var(--cov)}
.ytv .pl i,.cov .nw{background:var(--y);color:var(--on)}
.song .vw svg,.ytc .vw svg{color:var(--y2)}
.err{color:var(--err)}
#theme{padding:8px 10px}
header{gap:8px}.hgrow{min-width:0}header h1{white-space:nowrap}header h1 .chip{font-size:18px}
html[data-theme=light] header h1 .chip em{padding:0 6px}
.logo{background:var(--cov);color:var(--tx)}.logo svg{color:var(--lk)}
a.tag{text-decoration:none}
:focus-visible{outline:2px solid var(--olc)}

/* Spotify-style track list */
.tl{margin-bottom:6px}
.tr{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:14px;text-decoration:none;color:var(--tx);-webkit-tap-highlight-color:transparent}

.tn{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

.tn .vw{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mu);margin:0}

.go2{flex:none;display:inline-flex;align-items:center;gap:4px}

/* Today's playlist card: icon same size as Stationhead icon, yellow bg + dark note */

/* compact home: fits playlist + Stationhead + 4 songs + YouTube card in one screen */
main{padding-top:6px}
.dt{margin:0}.wl{font-size:19px;margin:0 0 8px}
.card.cc{padding:7px 12px;margin-bottom:6px;border-radius:18px}

.tr+.tr{margin-top:0}

.login main{padding:0 18px 40px;justify-content:center}

/* instant press feedback everywhere + no tap delay */
a,button,[role=button],.tr,.pf,.ytv,.go,.pill,.tag,.seg button,nav button,.btn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn,.pill,.tag,.go,.pb,.tr,.pf,.ytv,.seg button,nav button,.card[role=button],.card.feat,.lvc,.stat{transition:transform .08s ease-out,filter .08s,background-color .12s}
.btn:active,.pill:active,button.tag:active,a.tag:active,.go:active,.seg button:active,.pf:active{transform:scale(.94);filter:brightness(.92)}

/* ===== Learning-app style: soft blobs, floating dark pill nav, pastel cards (blue + yellow kept) ===== */

/* leaderboard */
.lb{position:relative;text-align:center;border-radius:30px;padding:6px 0 0;background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(137,206,250,.2) 0 9deg,transparent 9deg 18deg)}
.lbm span{display:inline-block;background:var(--y);color:var(--on);font:700 12px "Rubik",sans-serif;padding:3px 14px;border-radius:99px}
.lbt{margin:-2px 8px 14px;padding:12px;border-radius:99px;background:var(--b);color:var(--on);font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(29,28,33,.18)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.pc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.pc b{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.pav2{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--y);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--y)}
.p1 .pav2{width:78px;height:78px;font-size:40px;background:var(--b);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--b)}
.pav2 i{position:absolute;right:-4px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#1d1c21;color:var(--y);font:700 12px/22px "Rubik",sans-serif;font-style:normal}
.pts{display:inline-flex;align-items:center;gap:4px;background:var(--fld,rgba(137,206,250,.22));border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;margin-top:4px}.pts svg{color:var(--y2)}
.blk{width:100%;margin-top:8px;border-radius:14px 14px 0 0;background:linear-gradient(var(--y),transparent)}
.p1 .blk{height:120px;background:linear-gradient(var(--b),transparent)}.p2 .blk{height:88px}.p3 .blk{height:64px;background:linear-gradient(rgba(250,228,105,.7),transparent)}
.lbl{margin-top:-4px;display:flex;flex-direction:column;gap:8px;position:relative}
.lr{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:99px 99px 99px 99px;padding:8px 16px 8px 14px;box-shadow:0 4px 12px rgba(31,111,178,.08)}
.lr.me{outline:2px solid var(--y)}
.rk{font-size:15px;font-weight:800;width:30px}
.av2{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--b);flex:none}
.ln{min-width:0;display:flex;flex-direction:column;align-items:flex-start}.ln b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== certificate page: full theme background, thin lines ===== */
body.idpg{background:var(--bg)!important}
.idtop{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.idtop h2{margin:0;font-size:20px}
.idback{width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.idc{display:block;width:100%;max-width:380px;height:auto;margin:0 auto;border-radius:0;box-shadow:none}
.ida{max-width:380px;margin:14px auto 0}
.ida .btn.soft{background:transparent}
/* ===== nav: 6 tabs fit ===== */
nav button{flex:0 1 44px;width:44px;min-width:0;height:44px}
nav .on{width:52px;height:52px}
/* ===== leaderboard: card rows like the reference ===== */
.lr{border-radius:22px;border:1px solid var(--ln);padding:10px 16px 10px 14px}
.pts svg{color:var(--lk)}
.pod{margin-top:6px}

/* ===== leaderboard: solid theme background, no pattern, no gradients ===== */
body.rkpg{background:var(--bg)!important}
.lb{background:none!important}
.blk{background:var(--y)!important}
.p1 .blk{background:var(--b)!important}
.p3 .blk{background:var(--y)!important;opacity:.7}

/* ===== dock nav: flush to the bottom edge, flat, no float ===== */
nav{bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;border:0;border-radius:0;box-shadow:none;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:0;justify-content:space-around;background:var(--nav)}
nav button{flex:0 0 46px;width:46px;height:46px;border-radius:16px;background:transparent;color:var(--mu)}
nav .on{width:46px;height:46px;margin:0;background:var(--y);color:var(--on)}
html[data-theme=dark] nav{background:#1d1c21}
html[data-theme=dark] nav button{color:#a6a5ad}
html[data-theme=dark] nav .on{color:#1d1c21}
html[data-theme=light] nav{background:#fff!important;border:1px solid #d6dae1!important;border-bottom:0!important}
html[data-theme=light] nav button{background:transparent!important;color:#6b6a73!important}
html[data-theme=light] nav .on{background:#fae469!important;color:#1d1c21!important}
html[data-theme=dark] nav{border:1px solid #34333a!important;border-bottom:0!important}
/* ===== soft, quick press + page fade ===== */
.btn,.pill,.tag,.go,.pb,.tr,.pf,.ytv,.seg button,nav button,.card[role=button],.card.feat,.lvc,.stat{transition:transform .24s cubic-bezier(.2,.8,.2,1),background-color .2s ease,filter .2s ease}
.pr{transform:scale(.96)!important;filter:none!important;transition:transform .12s ease-out!important}
nav button.pr{transform:scale(.9)!important}
.tr.pr,.card.pr{transform:scale(.985)!important}
.btn:active,.pill:active,button.tag:active,a.tag:active,.go:active,.seg button:active,.pf:active,nav button:active{filter:none}
.fi{animation:fi .2s ease-out}
@keyframes fi{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== solid page background: white (light) / black (dark), no gradient, no tint ===== */
html[data-theme=dark]{--bg:#000}
html[data-theme=light]{--bg:#fff}
html,body,body.idpg,body.rkpg,body.nothome,body.login{background:var(--bg)!important;background-image:none!important}
#app,main,header{background:transparent!important}
html[data-theme=dark] nav{background:#000!important}

/* ===== restored: labelled dock (rounded top, wide yellow active) ===== */
nav{bottom:0;border-radius:22px 22px 0 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:4px;justify-content:space-between}
nav button{flex:1 1 0;width:auto;height:auto;min-width:0;border-radius:18px;padding:8px 0 7px;font:600 11px/1.2 "Rubik","Anuphan",sans-serif;gap:3px;flex-direction:column;align-items:center;background:transparent}
nav .on{width:auto;height:auto;margin:0;background:var(--y);color:var(--on)}
/* ===== restored: centered profile header ===== */
.phd{display:flex;flex-direction:column;align-items:center;text-align:center;margin:6px 0 16px}
.phd .pfa{width:112px;height:112px;border:0;padding:0;background:var(--y);margin:0 auto 12px}
.phd .pfp{background:var(--y);font-size:60px}
.pfn2{font-size:22px;font-weight:800;color:var(--tx);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfsub{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--mu);font-size:14px}
.lvt{display:inline-block;background:var(--lkbg);color:var(--lk);border:1px solid var(--lkbd);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px}
.more{margin-top:14px;flex-wrap:wrap}

/* ===== snappy: no page fade, short press transitions ===== */
.fi{animation:none!important}
.btn,.pill,.tag,.go,.pb,.tr,.pf,.ytv,.seg button,nav button,.card[role=button],.card.feat,.lvc,.stat{transition:transform .1s ease-out,background-color .1s ease,filter .1s ease}
.pr{transition:transform .06s ease-out!important}

/* ===== songs list: no background panel, no rank numbers ===== */
.tl{background:none!important;box-shadow:none!important;border-radius:0!important;padding:0!important}

/* ===== dark theme: Stationhead card = clean dark surface, readable text ===== */
html[data-theme=dark] .card.cc:not(.feat){background:#1a1a1f!important;border:1px solid #34333a!important;color:var(--tx)}
html[data-theme=dark] .card.cc:not(.feat) b{color:var(--tx)!important}
html[data-theme=dark] .card.cc:not(.feat) p{color:var(--mu)!important}

html[data-theme=dark] .card.cc:not(.feat) .ico.gr svg{color:#1d1c21!important}

/* ===== settings list ===== */
.card.set{padding:0!important;overflow:hidden;border:1px solid var(--ln)!important;border-radius:22px!important}
.srow{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--ln);cursor:pointer;color:var(--tx)}
.srow:last-child{border-bottom:0}
.srow .si{width:28px;display:grid;place-items:center;color:var(--lk);flex:none}
.srow .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow .st b{font-size:16px;font-weight:700}
.srow .st small{color:var(--mu);font-size:13px}
.srow .ch{color:var(--mu);display:grid;place-items:center}
.seg2{display:inline-flex;border:1px solid var(--ln);border-radius:99px;padding:3px;gap:2px;flex:none}

.seg2 button.on{background:var(--y);color:var(--on)}
.pinf{padding:0 16px 16px;border-bottom:1px solid var(--ln)}
.pinf[hidden]{display:none}

/* ===== home YouTube: full width, no heading/title, centred in the leftover screen ===== */
.ytsec{display:flex;align-items:center;box-sizing:border-box;padding:16px 0 20px}
.ytsec .ytrow{width:100%;margin:0;gap:0}
.ytsec .ytrow .ytc,.ytsec .ytrow .ytc:only-child{flex:0 0 100%;margin:0}
.ytsec .ytv{width:100%;margin:0;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.14)}

.avw{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}

.av2{overflow:hidden;background:#fff}
svg.i{filter:url(#sk)}

/* ---------- Certificate page (own page, follows theme, save as image) ---------- */
let drawGen = 0;
async function drawId(u) {
  const cv = document.getElementById('idc'); if (!cv || !u) return;
  const my = ++drawGen, dark = document.documentElement.dataset.theme === 'dark';
  const W = 640, H = 960, x = cv.getContext('2d'); cv.width = W; cv.height = H;
  try { await Promise.all([document.fonts.load('800 40px Rubik'), document.fonts.load('500 24px Rubik')]); } catch {}
  if (my !== drawGen) return;
  const F = 'Rubik, Anuphan, system-ui, sans-serif', Y = '#fae469', B = '#89cefa', ON = '#1d1c21';
  const BG = dark ? '#000000' : '#ffffff', TX = dark ? '#fdfefd' : '#1d1c21', MU = dark ? '#a6a5ad' : '#6b6a73', LN = dark ? '#3a3940' : '#d9dde3', SF = dark ? '#26252b' : '#ffffff';
  const rr = (a, b, w, h, r) => { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); };
  const txt = (s, px, py, font, col, al = 'left') => { x.font = font; x.fillStyle = col; x.textAlign = al; x.fillText(s, px, py); };
  const line = (x1, y1, x2, y2) => { x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.lineWidth = 1; x.strokeStyle = LN; x.stroke(); };
  const star = (cx, cy, r, col, rot = 0) => { x.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + (Math.PI / 5) * i - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; x[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); } x.closePath(); x.fillStyle = col; x.fill(); };
  // ===== minimal cute certificate: thin lines, tiger stickers =====
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  rr(16, 16, W - 32, H - 32, 32); x.lineWidth = 1; x.strokeStyle = LN; x.stroke();
  let sk = {}, ph = null;
  try { const r = await Promise.all([loadImg(STK.folder), loadImg(STK.melon), loadImg(STK.mk)]); sk = { folder: r[0], melon: r[1], mk: r[2] }; } catch {}
  try { ph = await loadImg(getPic(u) || avUri(u)); } catch {}
  if (my !== drawGen) return;
  const img = (im, a, b, w) => { if (im) x.drawImage(im, a, b, w, w * im.height / im.width); };
  // header
  img(sk.folder, 44, 38, 66);
  txt('MOLO#2 STRM HUB', 126, 72, `800 27px ${F}`, TX);
  txt('Certificate of Streaming', 126, 100, `500 16px ${F}`, MU);
  line(48, 126, W - 48, 126);
  // photo / avatar in a round frame
  const cx = 320, cy = 292, R = 118;
  x.beginPath(); x.arc(cx, cy, R + 8, 0, 7); x.fillStyle = Y; x.fill();
  x.save(); x.beginPath(); x.arc(cx, cy, R, 0, 7); x.clip(); x.fillStyle = SF; x.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  if (ph) { const k = Math.max(2 * R / ph.width, 2 * R / ph.height), w = ph.width * k, h = ph.height * k; x.drawImage(ph, cx - w / 2, cy - R - (h - 2 * R) * 0.25, w, h); }
  x.restore();
  img(sk.melon, 396, 322, 150);

/* ---------- actions ---------- */
const v = (id) => $('#' + id).value.trim();
const SUBT = { station: 'home', ranking: 'profile', idcard: 'profile', howto: 'profile', admin: 'profile' };
const MAINT = ['home', 'playlist', 'missions', 'stats', 'profile'];
try { history.replaceState({ tab: S.tab, n: 0 }, ''); } catch {}
window.go = (tab) => {
  if (tab === S.tab) { render(); return; }
  const n = (history.state && history.state.n) || 0;
  const flat = MAINT.includes(tab) && MAINT.includes(S.tab) && S.tab !== 'home'; // tab-to-tab: don't pile up history
  try { flat ? history.replaceState({ tab, n }, '') : history.pushState({ tab, n: n + 1 }, ''); } catch {}
  S.tab = tab; render();
};
window.addEventListener('popstate', (e) => { S.tab = (e.state && e.state.tab) || 'home'; render(); });
window.back = () => {
  if (history.state && history.state.n > 0) { history.back(); return; }
  S.tab = SUBT[S.tab] || 'home'; try { history.replaceState({ tab: S.tab, n: 0 }, ''); } catch {} render();
};
window.logout = logout;
window.auth = async (kind) => {
  const bt = [...document.querySelectorAll('.login .btn')]; bt.forEach((b) => { b.disabled = true; b.style.opacity = '.6'; });
  try { const r = await api(kind, { username: v('u'), pin: v('p') }); S.token = r.token; S.user = r.user; localStorage.setItem('tok', r.token); S.tab = 'home'; render(); }
  catch (e) { $('#err').textContent = e.message; bt.forEach((b) => { b.disabled = false; b.style.opacity = ''; }); }
};
window.doCheckin = safe(async (el) => { lock(el); const r = await api('checkin'); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.doAct = safe(async (a, el) => { lock(el); const r = await api(a); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.sendRec = safe(async (el) => {
  lock(el);
  await api('submitRecord', { platform: v('f-p'), hours: v('f-h'), streams: v('f-s'), date: v('f-d'), evidence: v('f-e') });
  toast(t('saved')); render(true);
});
window.togglePub = safe(async (val) => { await api('setPublic', { value: val }); render(); });
window.unlock = safe(async () => { S.admin = v('a-s'); sessionStorage.setItem('adm', S.admin); try { await api('a_pending'); } catch (e) { S.admin = ''; sessionStorage.removeItem('adm'); throw e; } render(); });
window.adm = safe(async (a, b) => { await api(a, b); toast(t('saved')); });
window.review = safe(async (rid, approve) => { await api('a_review', { rid, approve }); render(); });

/* ---------- shell ---------- */
const HC = (() => { try { return JSON.parse(sessionStorage.getItem('hc') || '{}'); } catch { return {}; } })(); // rendered HTML per tab: shown instantly, refreshed in background
let warmed = false, shown = '', gen = 0;
const clearHC = () => { for (const k in HC) delete HC[k]; warmed = false; try { sessionStorage.removeItem('hc'); } catch {} };
const SKEL = '<div class="skl"></div><div class="skl"></div><div class="skl s"></div>';
const PFQ = {};
function prefetch(k) {
  if ((!S.token && !DEMO) || !V[k]) return;
  const key = k + lang; if (HC[key] || PFQ[key]) return;
  PFQ[key] = 1;
  V[k]().then((h) => { if (!HC[key]) HC[key] = h; }).catch(() => {}).finally(() => { delete PFQ[key]; });
}
function warm() {
  if (warmed || DEMO || !S.token) return;
  warmed = true;
  setTimeout(() => ['playlist', 'missions', 'stats', 'station', 'ranking', 'profile'].forEach(prefetch), 30);
}
function fitHome() {
  const el = document.querySelector('.ytsec'), nv = document.getElementById('nav');
  if (!el) return;
  el.style.minHeight = '';
  const vh = window.innerHeight || 0;
  const top = el.getBoundingClientRect().top + window.scrollY;
  const free = vh - top - (nv && !nv.hidden ? nv.offsetHeight : 0);
  const need = el.querySelector('.ytv') ? el.querySelector('.ytv').offsetHeight + 36 : 0;
  el.style.minHeight = Math.max(free, need) + 'px';
}
window.addEventListener('resize', () => requestAnimationFrame(fitHome));
async function render(force) {
  document.documentElement.lang = lang;
  { const xb = $('#xb'); if (xb) xb.hidden = !((S.token || DEMO) && SUBT[S.tab]); }
  document.body.classList.toggle('login', !S.token && !DEMO);
  document.body.classList.toggle('nothome', S.tab !== 'home');
  document.body.classList.toggle('idpg', S.tab === 'idcard');
  document.body.classList.toggle('rkpg', S.tab === 'ranking');
  const nav = $('#nav'), main = $('#main');
  if (!S.token && !DEMO) { nav.hidden = true; main.innerHTML = V.auth(); shown = 'auth'; return; }
  if (DEMO && !S.user) S.user = { id: 'demo', username: 'molo2_listener', avatar: '🐰', exp: 600, level: 4, levelName: 'Dedicated Streamer', prevExp: 600, nextExp: 1000, streak: 5, totalHours: 12.5, totalStreams: 2450, public: true, badges: ['first', 'streak5', 'listener', 'dedicated'] };
  nav.hidden = false;
  if (nav.dataset.l !== lang) { nav.innerHTML = TABS.map(([k, e]) => `<button data-k="${k}" onclick="go('${k}')"><span>${ic(e, 20)}</span>${t(k)}</button>`).join(''); nav.dataset.l = lang; }
  [...nav.children].forEach((b) => b.classList.toggle('on', b.dataset.k === S.tab || (b.dataset.k === 'home' && S.tab === 'station') || (b.dataset.k === 'profile' && ['ranking', 'idcard', 'howto', 'admin'].includes(S.tab))));
  const tab = S.tab, key = tab + lang, my = ++gen;
  if (shown !== key) { main.innerHTML = HC[key] || SKEL; window.scrollTo(0, 0); shown = key; main.classList.remove('fi'); void main.offsetWidth; main.classList.add('fi'); }
  if (tab === 'home') requestAnimationFrame(fitHome);
  let html;
  try { html = await V[tab](); } catch (e) { html = `<div class="card"><p>${esc(e.message)}</p></div>`; }
  if (my !== gen) return;
  const typing = !force && /INPUT|SELECT/.test((document.activeElement || {}).tagName || '');
  if (HC[key] !== html && !typing) main.innerHTML = html;
  if (tab === 'home') requestAnimationFrame(fitHome);
  HC[key] = html;
  try { sessionStorage.setItem('hc', JSON.stringify(HC)); } catch {}
  if (tab === 'idcard') drawId(S.user);
  warm();
}
let theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = theme === 'light' ? '#ffffff' : '#000000';
  if (document.getElementById('idc')) drawId(S.user);
}
window.toggleTheme = () => { theme = theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem('theme', theme); } catch {} applyTheme(); render(true); };
applyTheme();
window.setTheme = (m) => { if (theme !== m) toggleTheme(); };
window.setLang = (l) => { if (lang !== l) toggleLang(); };
window.savePin = safe(async (el) => {
  const o = v('pin-o'), n = v('pin-n'); lock(el);
  try { await api('changePin', { oldPin: o, newPin: n }); } finally { el.disabled = false; el.textContent = el.dataset.t; }
  toast(t('saved')); $('#pin-o').value = ''; $('#pin-n').value = ''; $('#pinf').hidden = true;
});
window.toggleLang = () => { lang = lang === 'th' ? 'en' : 'th'; localStorage.setItem('lang', lang); render(true); };

/* press feedback: pointerdown adds .pr, removed shortly after release */
(() => {
  const SEL = 'nav button,button,a[href],[role=button],.btn,.pill,.tag,.tr,.pf,.ytv,.go,.seg button,.card.feat';
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('pointerdown', (e) => {
    const nb = e.target.closest && e.target.closest('nav button'); if (nb && nb.dataset.k) prefetch(nb.dataset.k);
    const el = e.target.closest && e.target.closest(SEL);
    if (!el || el.disabled) return;
    el.classList.add('pr'); el._t = Date.now();
    const off = () => { const w = Math.max(0, 80 - (Date.now() - el._t)); setTimeout(() => el.classList.remove('pr'), w); };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((n) => el.addEventListener(n, off, { once: true }));
  }, { passive: true });
})();
render();
</script>
</body>
