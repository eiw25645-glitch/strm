<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOLO2 Streaming Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--mute:#7a859c;--blue:#7ba7d9;--blue2:#a8c4e8;--soft:#eef4fc;--card:#f6f8fc;--line:#e4e9f2;--ok:#4c9f7a;--bad:#c4526a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
header h1{font-size:17px;font-weight:800}header h1 b{color:var(--blue)}
header p{font-size:12px;color:var(--mute)}
.hgrow{flex:1}
.pill{border:0;background:var(--soft);color:#4a76ab;border-radius:99px;padding:8px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
main{flex:1;padding:18px 20px 110px}
h2{font-size:24px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;background:#fff}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card p{color:var(--mute);font-size:14px;line-height:1.5}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0;border-radius:26px;padding:22px}
.hero small{opacity:.85;font-size:12px}.hero .big{font-size:36px;font-weight:800;margin:4px 0 0}.hero .nm{font-size:17px;opacity:.95}
.bar{height:10px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden;margin:8px 0}
.hero .bar{background:rgba(255,255,255,.35)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.hero .bar i{background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:20px;padding:16px}
.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--mute);font-size:13px}.stat .e{font-size:22px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:99px;padding:14px;font:700 15px inherit;font-family:inherit;background:var(--blue);color:#fff;cursor:pointer;text-decoration:none;margin-top:12px}
.btn.soft{background:var(--soft);color:#4a76ab}.btn.w{background:#fff;color:#4a76ab;display:inline-block;width:auto;padding:14px 28px}
.btn:disabled{opacity:.5}
.tag{background:var(--soft);color:#4a76ab;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e3f4ec;color:var(--ok)}.tag.bad{background:#fbe6ec;color:var(--bad)}
.list>div{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:15px inherit;font-family:inherit;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{border:0;border-radius:99px;padding:10px 16px;font:600 14px inherit;font-family:inherit;background:var(--card);color:var(--mute)}.seg .on{background:var(--soft);color:#4a76ab}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:14px}
.chart div{flex:1;text-align:center;font-size:12px;color:var(--mute)}.chart i{display:block;background:var(--blue2);border-radius:10px 10px 4px 4px;min-height:6px;margin-bottom:6px}.chart .hi i{background:var(--blue)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;font-size:12px;margin-top:12px}.ach span{display:block;font-size:30px}.ach .lock{opacity:.3;filter:grayscale(1)}
.av{width:96px;height:96px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:48px;margin:6px auto 10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:0;font:600 10px inherit;font-family:inherit;color:var(--mute);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:20px}nav .on{color:#4a76ab}
.more{display:flex;gap:10px;justify-content:center;margin-top:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;z-index:9;max-width:90%}
.err{color:var(--bad);font-size:13px;margin-top:10px}
a{color:#4a76ab}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🎧</div>
    <div class="hgrow"><h1>MOLO2 <b>SPACE</b></h1><p id="tag"></p></div>
    <button class="pill" id="lang"></button>
  </header>
  <main id="main"></main>
  <nav id="nav" hidden></nav>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https:\/\//.test(u || '') ? esc(u) : '#');
const DEMO = new URLSearchParams(location.search).has('demo');
const thaiToday = () => new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 10);

/* ---------- i18n ---------- */
const T = {
  en: { tag: 'Stream together, grow together.', home: 'Home', playlist: 'Playlist', station: 'Stationhead', missions: 'Missions', stats: 'Stats', profile: 'Profile', ranking: 'Ranking', admin: 'Admin',
    welcome: 'Welcome back!', journey: 'Your streaming journey', left: (n, l) => `${n} EXP left to reach Level ${l}`, maxed: 'Max level reached',
    hours: 'Streaming hours', streams: 'Reported streams', totalExp: 'Total EXP', streak: 'Current streak', days: 'days', todayPl: 'Today’s playlist', open: 'Open', none: 'Not set yet',
    openSpotify: 'Open Spotify', schedule: 'Playlist schedule', today: 'Today', upcoming: 'Upcoming', notSet: 'Not set',
    howStream: 'How to stream', howStreamTxt: 'Open the daily playlist using the button above, then claim your mission. Playlist links are updated by the admin each day.',
    join: 'Join Stationhead', how: 'How to join', s1: 'Open Stationhead', s2: 'Sign in to your account', s3: 'Join our room', room: 'Room link', roomNone: 'The official room link will be added by the admin.', openRoom: 'Open room',
    daily: 'Daily', weekly: 'Weekly', special: 'Special', checkin: 'Daily check-in', checkinD: 'Visit MOLO2 Streaming Space every day.', doCheckin: 'Check in', done: 'Done',
    plM: 'Daily playlist', plD: 'Listen to the daily playlist, then claim.', claim: 'Claim', wkM: 'Weekly streamer', wkD: 'Submit records on 5 different days.', spM: 'MOLO2 special mission', noSpecial: 'No special mission right now.',
    weeklyAct: 'Weekly activity', submit: 'Submit streaming record', submitD: 'Add your own listening activity. Records count after admin approval.', platform: 'Platform', sh: 'Streaming hours', rs: 'Reported streams (optional)', date: 'Date', ev: 'Evidence link (optional)', send: 'Submit record', recent: 'Recent records', noRec: 'No records yet.',
    pending: 'Pending', approved: 'Approved', rejected: 'Rejected', badges: 'Badges', hrs: 'Hours', ach: 'Achievements', acc: 'Account settings', pub: 'Public leaderboard', on: 'ON', off: 'OFF', logout: 'Log out',
    login: 'Log in', register: 'Create account', user: 'Username', pin: 'PIN (4–8 digits)', gained: (n) => `+${n} EXP`, already: 'Already done today', saved: 'Saved',
    aPl: 'Set daily playlist', aTitle: 'Title', aUrl: 'Link (https://…)', aRoom: 'Set Stationhead room link', aSpecial: 'Special mission text', save: 'Save', aPend: 'Records waiting for review', approve: 'Approve', reject: 'Reject', empty: 'Nothing here yet.', secret: 'Admin secret', unlock: 'Unlock',
    ach_first: 'First step', ach_streak5: '5-day streak', ach_listener: 'Listener', ach_dedicated: 'Dedicated', ach_crown: 'Crown', ach_diamond: 'Diamond', days7: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] },
  th: { tag: 'สตรีมไปด้วยกัน เติบโตไปด้วยกัน', home: 'หน้าแรก', playlist: 'เพลย์ลิสต์', station: 'Stationhead', missions: 'ภารกิจ', stats: 'สถิติ', profile: 'โปรไฟล์', ranking: 'อันดับ', admin: 'แอดมิน',
    welcome: 'ยินดีต้อนรับกลับ!', journey: 'เส้นทางสตรีมของคุณ', left: (n, l) => `อีก ${n} EXP ถึงเลเวล ${l}`, maxed: 'ถึงเลเวลสูงสุดแล้ว',
    hours: 'ชั่วโมงสตรีม', streams: 'ยอดสตรีมที่รายงาน', totalExp: 'EXP รวม', streak: 'สตรีคต่อเนื่อง', days: 'วัน', todayPl: 'เพลย์ลิสต์วันนี้', open: 'เปิด', none: 'ยังไม่ได้ตั้ง',
    openSpotify: 'เปิด Spotify', schedule: 'ตารางเพลย์ลิสต์', today: 'วันนี้', upcoming: 'เร็วๆ นี้', notSet: 'ยังไม่ตั้ง',
    howStream: 'วิธีสตรีม', howStreamTxt: 'กดปุ่มด้านบนเพื่อเปิดเพลย์ลิสต์ประจำวัน แล้วกดรับภารกิจ แอดมินจะอัปเดตลิงก์ทุกวัน',
    join: 'เข้า Stationhead', how: 'วิธีเข้าร่วม', s1: 'เปิด Stationhead', s2: 'เข้าสู่ระบบบัญชีของคุณ', s3: 'เข้าห้องของเรา', room: 'ลิงก์ห้อง', roomNone: 'แอดมินจะเพิ่มลิงก์ห้องทางการให้ภายหลัง', openRoom: 'เปิดห้อง',
    daily: 'รายวัน', weekly: 'รายสัปดาห์', special: 'พิเศษ', checkin: 'เช็คอินรายวัน', checkinD: 'เข้า MOLO2 Streaming Space ทุกวัน', doCheckin: 'เช็คอิน', done: 'เสร็จแล้ว',
    plM: 'เพลย์ลิสต์ประจำวัน', plD: 'ฟังเพลย์ลิสต์ประจำวัน แล้วกดรับ', claim: 'รับ EXP', wkM: 'นักสตรีมประจำสัปดาห์', wkD: 'ส่งบันทึกให้ครบ 5 วันที่ต่างกัน', spM: 'ภารกิจพิเศษ MOLO2', noSpecial: 'ตอนนี้ยังไม่มีภารกิจพิเศษ',
    weeklyAct: 'กิจกรรมรายสัปดาห์', submit: 'ส่งบันทึกการสตรีม', submitD: 'เพิ่มกิจกรรมการฟังของคุณ บันทึกจะนับเมื่อแอดมินอนุมัติ', platform: 'แพลตฟอร์ม', sh: 'ชั่วโมงสตรีม', rs: 'ยอดสตรีมที่รายงาน (ไม่บังคับ)', date: 'วันที่', ev: 'ลิงก์หลักฐาน (ไม่บังคับ)', send: 'ส่งบันทึก', recent: 'บันทึกล่าสุด', noRec: 'ยังไม่มีบันทึก',
    pending: 'รอตรวจ', approved: 'อนุมัติแล้ว', rejected: 'ไม่ผ่าน', badges: 'เหรียญ', hrs: 'ชั่วโมง', ach: 'ความสำเร็จ', acc: 'ตั้งค่าบัญชี', pub: 'แสดงในอันดับสาธารณะ', on: 'เปิด', off: 'ปิด', logout: 'ออกจากระบบ',
    login: 'เข้าสู่ระบบ', register: 'สร้างบัญชี', user: 'ชื่อผู้ใช้', pin: 'PIN (ตัวเลข 4–8 หลัก)', gained: (n) => `+${n} EXP`, already: 'วันนี้ทำไปแล้ว', saved: 'บันทึกแล้ว',
    aPl: 'ตั้งเพลย์ลิสต์รายวัน', aTitle: 'ชื่อ', aUrl: 'ลิงก์ (https://…)', aRoom: 'ตั้งลิงก์ห้อง Stationhead', aSpecial: 'ข้อความภารกิจพิเศษ', save: 'บันทึก', aPend: 'บันทึกที่รอตรวจ', approve: 'อนุมัติ', reject: 'ปฏิเสธ', empty: 'ยังไม่มีรายการ', secret: 'รหัสแอดมิน', unlock: 'ปลดล็อก',
    ach_first: 'ก้าวแรก', ach_streak5: 'สตรีค 5 วัน', ach_listener: 'ผู้ฟัง', ach_dedicated: 'ทุ่มเท', ach_crown: 'มงกุฎ', ach_diamond: 'เพชร', days7: ['จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.', 'อา.'] },
};
let lang = localStorage.getItem('lang') || 'th';
const t = (k, ...a) => { const v = T[lang][k]; return typeof v === 'function' ? v(...a) : v ?? k; };

/* ---------- state + api ---------- */
const S = { tab: 'home', token: localStorage.getItem('tok') || '', user: null, admin: sessionStorage.getItem('adm') || '' };

const MOCK = {
  me: () => ({ user: S.user, checkedIn: false }),
  today: () => ({ date: thaiToday(), playlist: { title: 'MARK LEE — Daily Stream', url: 'https://open.spotify.com' }, room: 'https://www.stationhead.com' }),
  schedule: () => ({ items: [0, 1, 2].map((i) => ({ date: new Date(Date.now() + (7 + i * 24) * 36e5).toISOString().slice(0, 10), title: i < 2 ? 'Scheduled playlist' : null })) }),
  missions: () => ({ checkin: false, playlist: { done: false, available: true }, weekly: { days: 3, target: 5, claimed: false }, special: null }),
  stats: () => ({ totalHours: 12.5, totalStreams: 2450, week: [1, 2.5, 0.8, 3, 1.8, 1.4, 0.6], recent: [{ rid: '1', platform: 'Spotify', hours: 2, streams: 150, date: thaiToday(), status: 'approved' }] }),
  ranking: () => ({ items: [{ rank: 1, username: 'molo2_listener', avatar: '🐰', exp: 600, level: 4 }, { rank: 2, username: 'bunny_01', avatar: '🐱', exp: 420, level: 3 }] }),
  a_pending: () => ({ items: [] }),
};
async function api(action, body = {}) {
  if (DEMO) { const f = MOCK[action]; return f ? f() : { ok: true, user: S.user, gained: 10 }; }
  const r = await fetch('/api/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token, 'x-admin-secret': S.admin }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({ error: 'Server error' }));
  if (!r.ok) { if (r.status === 401 && S.token) { logout(); } throw new Error(j.error || 'Error'); }
  return j;
}
function toast(m) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; document.body.append(e); setTimeout(() => e.remove(), 2200); }
const safe = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };
function logout() { localStorage.removeItem('tok'); S.token = ''; S.user = null; render(); }

/* ---------- views ---------- */
const TABS = [['home', '🏠'], ['playlist', '🎵'], ['station', '📻'], ['missions', '✨'], ['stats', '📊'], ['profile', '🤍']];
const ACH = [['first', '🌱'], ['streak5', '🔥'], ['listener', '🎧'], ['dedicated', '⭐'], ['crown', '👑'], ['diamond', '💎']];
const pct = (u) => (u.nextExp ? Math.min(100, ((u.exp - u.prevExp) / (u.nextExp - u.prevExp)) * 100) : 100);
const fmtDate = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString(lang === 'th' ? 'th-TH-u-ca-gregory' : 'en-GB', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' });

const V = {
  async home() {
    const [m, d] = await Promise.all([api('me'), api('today')]);
    S.user = m.user; const u = m.user;
    return `<p class="sub" style="margin:0">${esc(fmtDate(d.date))}</p><h2>${t('welcome')} ✨</h2><br>
    <div class="card hero"><small>${t('journey')}</small><div class="big">Level ${String(u.level).padStart(2, '0')}</div><div class="nm">${esc(u.levelName)}</div><br>
      <div class="row"><span>${u.exp} EXP</span><span>${u.nextExp ?? '—'} EXP</span></div><div class="bar"><i style="width:${pct(u)}%"></i></div>
      <small>${u.nextExp ? t('left', u.nextExp - u.exp, u.level + 1) : t('maxed')}</small></div>
    <div class="grid">
      <div class="stat"><div class="e">⏱️</div><div class="n">${u.totalHours}<small style="font-size:14px"> ${t('hrs').toLowerCase()}</small></div><div class="l">${t('hours')}</div></div>
      <div class="stat"><div class="e">🎵</div><div class="n">${u.totalStreams.toLocaleString()}</div><div class="l">${t('streams')}</div></div>
      <div class="stat"><div class="e">⚡</div><div class="n">${u.exp}</div><div class="l">${t('totalExp')}</div></div>
      <div class="stat"><div class="e">🔥</div><div class="n">${u.streak} <small style="font-size:14px">${t('days')}</small></div><div class="l">${t('streak')}</div></div></div>
    <div class="card"><div class="row"><h3>${t('todayPl')}</h3><span class="tag">${d.date.slice(5)}</span></div><br>
      <div class="row"><div><b>${esc(d.playlist ? d.playlist.title : t('none'))}</b><p>Spotify</p></div>
      ${d.playlist ? `<a class="tag" href="${safeUrl(d.playlist.url)}" target="_blank" rel="noopener">${t('open')}</a>` : ''}</div></div>
    <div class="card"><div class="row"><div><h3>Stationhead 📻</h3><p>${t('join')}</p></div><button class="tag" style="border:0" onclick="go('station')">${t('open')}</button></div></div>`;
  },
  async playlist() {
    const [d, s] = await Promise.all([api('today'), api('schedule')]);
    return `<h2>${esc(fmtDate(d.date).split(',')[0])}</h2><p class="sub">${t('todayPl')}</p>
    <div class="card"><div class="row" style="gap:14px;justify-content:flex-start"><div class="logo" style="width:64px;height:64px;font-size:30px">🎧</div><div><p>Spotify</p><h3>${esc(d.playlist ? d.playlist.title : t('none'))}</h3></div></div>
      ${d.playlist ? `<a class="btn" href="${safeUrl(d.playlist.url)}" target="_blank" rel="noopener">${t('openSpotify')} ↗</a>` : ''}</div>
    <div class="card"><h3>${t('schedule')}</h3><div class="list">${s.items.map((i, n) => `<div><div><b>${i.date.slice(5)}</b><p>${esc(i.title || t('notSet'))}</p></div><span class="tag">${n ? t('upcoming') : t('today')}</span></div>`).join('')}</div></div>
    <div class="card"><h3>${t('howStream')}</h3><p>${t('howStreamTxt')}</p></div>`;
  },
  async station() {
    const d = await api('today');
    return `<h2>Stationhead 📻</h2><p class="sub">${t('join')}</p>
    <div class="card hero" style="text-align:center"><div style="font-size:56px">📻</div><div class="big" style="font-size:26px">MARK LEE STATION</div><p style="color:#fff;opacity:.9;margin:6px 0 16px">Listen together. Support together.</p>
      ${d.room ? `<a class="btn w" href="${safeUrl(d.room)}" target="_blank" rel="noopener">${t('join')} ↗</a>` : ''}</div>
    <div class="card"><h3>${t('how')}</h3><div class="list"><div><span>1 · ${t('s1')}</span></div><div><span>2 · ${t('s2')}</span></div><div><span>3 · ${t('s3')}</span></div></div></div>
    <div class="card"><h3>${t('room')}</h3><p>${d.room ? esc(d.room) : t('roomNone')}</p>${d.room ? `<a class="btn soft" href="${safeUrl(d.room)}" target="_blank" rel="noopener">${t('openRoom')} ↗</a>` : ''}</div>`;
  },
  async missions() {
    const m = await api('missions');
    const w = m.weekly;
    const mc = (title, desc, exp, body) => `<div class="card"><div class="row"><h3>${title}</h3><span class="tag">+${exp} EXP</span></div><p>${desc}</p>${body}</div>`;
    const done = `<span class="tag ok" style="display:inline-block;margin-top:12px">✓ ${t('done')}</span>`;
    return `<h2>${t('missions')}</h2><p class="sub">Little steps, more EXP.</p>
    ${mc(t('checkin'), t('checkinD'), 10, m.checkin ? done : `<button class="btn soft" onclick="doCheckin()">${t('doCheckin')}</button>`)}
    ${mc(t('plM'), t('plD'), 20, m.playlist.done ? done : `<button class="btn soft" ${m.playlist.available ? '' : 'disabled'} onclick="doAct('claimPlaylist')">${t('claim')}</button>`)}
    ${mc(t('wkM'), t('wkD'), 100, `<div class="bar"><i style="width:${Math.min(100, (w.days / w.target) * 100)}%"></i></div><p>${w.days} / ${w.target} ${t('days')}</p>${w.claimed ? done : `<button class="btn soft" ${w.days >= w.target ? '' : 'disabled'} onclick="doAct('claimWeekly')">${t('claim')}</button>`}`)}
    ${mc(t('spM'), esc(m.special || t('noSpecial')), 200, '')}`;
  },
  async stats() {
    const s = await api('stats');
    const max = Math.max(1, ...s.week), dn = T[lang].days7;
    const wd = (new Date(Date.now() + 7 * 36e5).getUTCDay() + 6) % 7;
    const st = { pending: 'tag', approved: 'tag ok', rejected: 'tag bad' };
    return `<h2>${t('stats')} 📊</h2><p class="sub"></p>
    <div class="grid"><div class="stat"><div class="l">${t('hours')}</div><div class="n">${s.totalHours}</div></div><div class="stat"><div class="l">${t('streams')}</div><div class="n">${s.totalStreams.toLocaleString()}</div></div></div>
    <div class="card"><h3>${t('weeklyAct')}</h3><div class="chart">${s.week.map((h, i) => `<div class="${i === wd ? 'hi' : ''}"><i style="height:${(h / max) * 110}px" title="${h}h"></i>${dn[i]}</div>`).join('')}</div></div>
    <div class="card"><h3>${t('submit')}</h3><p>${t('submitD')}</p>
      <label for="f-p">${t('platform')}</label><select id="f-p">${['Spotify', 'Apple Music', 'YouTube Music', 'Stationhead', 'Other'].map((p) => `<option>${p}</option>`).join('')}</select>
      <label for="f-h">${t('sh')}</label><input id="f-h" type="number" inputmode="decimal" min="0.1" max="24" step="0.1" placeholder="2">
      <label for="f-s">${t('rs')}</label><input id="f-s" type="number" inputmode="numeric" min="0" placeholder="150">
      <label for="f-d">${t('date')}</label><input id="f-d" type="date" value="${thaiToday()}" max="${thaiToday()}">
      <label for="f-e">${t('ev')}</label><input id="f-e" type="url" placeholder="https://">
      <button class="btn" onclick="sendRec()">${t('send')}</button></div>
    <div class="card"><h3>${t('recent')}</h3><div class="list">${s.recent.length ? s.recent.map((r) => `<div><div><b>${esc(r.platform)} · ${r.hours}h</b><p>${esc(r.date)} · ${r.streams} streams</p></div><span class="${st[r.status]}">${t(r.status)}</span></div>`).join('') : `<p>${t('noRec')}</p>`}</div></div>`;
  },
  async profile() {
    const m = await api('me'); const u = (S.user = m.user);
    return `<div class="av">${esc(u.avatar)}</div><h2 style="text-align:center">${esc(u.username)}</h2><p class="sub" style="text-align:center">MOLO2 Streamer · <span class="tag">Level ${String(u.level).padStart(2, '0')} · ${esc(u.levelName)}</span></p>
    <div class="card"><div class="row"><span>${u.exp} EXP</span><span>${u.nextExp ?? '—'} EXP</span></div><div class="bar"><i style="width:${pct(u)}%"></i></div></div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat" style="text-align:center"><div class="e">🏅</div><div class="n">${u.badges.length}</div><div class="l">${t('badges')}</div></div><div class="stat" style="text-align:center"><div class="e">🔥</div><div class="n">${u.streak}</div><div class="l">${t('streak')}</div></div><div class="stat" style="text-align:center"><div class="e">⏱️</div><div class="n">${u.totalHours}</div><div class="l">${t('hrs')}</div></div></div>
    <div class="card"><h3>${t('ach')}</h3><div class="ach">${ACH.map(([k, e]) => `<div class="${u.badges.includes(k) ? '' : 'lock'}"><span>${e}</span>${t('ach_' + k)}</div>`).join('')}</div></div>
    <div class="card"><h3>${t('acc')}</h3><div class="list"><div><span>${t('pub')}</span><button class="tag" style="border:0" onclick="togglePub(${!u.public})">${u.public ? t('on') : t('off')}</button></div></div>
      <button class="btn soft" onclick="logout()">${t('logout')}</button></div>
    <div class="more"><button class="pill" onclick="go('ranking')">🏆 ${t('ranking')}</button><button class="pill" onclick="go('admin')">⚙️ ${t('admin')}</button></div>`;
  },
  async ranking() {
    const r = await api('ranking');
    return `<h2>🏆 ${t('ranking')}</h2><p class="sub"></p><div class="card"><div class="list">${r.items.length ? r.items.map((x) => `<div><span>${x.rank}. ${esc(x.avatar)} <b>${esc(x.username)}</b></span><span class="tag">${x.exp} EXP · Lv ${x.level}</span></div>`).join('') : `<p>${t('empty')}</p>`}</div></div>`;
  },
  async admin() {
    if (!S.admin) return `<h2>⚙️ ${t('admin')}</h2><div class="card"><label for="a-s">${t('secret')}</label><input id="a-s" type="password" autocomplete="off"><button class="btn" onclick="unlock()">${t('unlock')}</button></div>`;
    const p = await api('a_pending');
    return `<h2>⚙️ ${t('admin')}</h2><p class="sub"></p>
    <div class="card"><h3>${t('aPl')}</h3><label for="a-d">${t('date')}</label><input id="a-d" type="date" value="${thaiToday()}"><label for="a-t">${t('aTitle')}</label><input id="a-t" value="MARK LEE — Daily Stream"><label for="a-u">${t('aUrl')}</label><input id="a-u" type="url"><button class="btn" onclick="adm('a_setPlaylist',{date:v('a-d'),title:v('a-t'),url:v('a-u')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aRoom')}</h3><input id="a-r" type="url" placeholder="https://"><button class="btn" onclick="adm('a_setRoom',{url:v('a-r')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aSpecial')}</h3><input id="a-x"><button class="btn" onclick="adm('a_setSpecial',{text:v('a-x')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aPend')}</h3><div class="list">${p.items.length ? p.items.map((r) => `<div><div><b>${esc(r.uid)} · ${esc(r.platform)} · ${r.hours}h</b><p>${esc(r.date)} · ${r.streams} streams${/^https:\/\//.test(r.evidence) ? ` · <a href="${safeUrl(r.evidence)}" target="_blank" rel="noopener">link</a>` : ''}</p></div><div style="display:flex;gap:6px"><button class="tag ok" style="border:0" onclick="review('${esc(r.rid)}',true)">${t('approve')}</button><button class="tag bad" style="border:0" onclick="review('${esc(r.rid)}',false)">${t('reject')}</button></div></div>`).join('') : `<p>${t('empty')}</p>`}</div></div>`;
  },
  auth() {
    return `<h2>MOLO2 Space</h2><p class="sub">${t('tag')}</p><div class="card">
    <label for="u">${t('user')}</label><input id="u" autocomplete="username" autocapitalize="none"><label for="p">${t('pin')}</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="btn" onclick="auth('login')">${t('login')}</button><button class="btn soft" onclick="auth('register')">${t('register')}</button><div class="err" id="err" role="alert"></div></div>`;
  },
};

/* ---------- actions ---------- */
const v = (id) => $('#' + id).value.trim();
window.go = (tab) => { S.tab = tab; render(); };
window.logout = logout;
window.auth = async (kind) => {
  try { const r = await api(kind, { username: v('u'), pin: v('p') }); S.token = r.token; S.user = r.user; localStorage.setItem('tok', r.token); S.tab = 'home'; render(); }
  catch (e) { $('#err').textContent = e.message; }
};
window.doCheckin = safe(async () => { const r = await api('checkin'); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.doAct = safe(async (a) => { const r = await api(a); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.sendRec = safe(async () => {
  await api('submitRecord', { platform: v('f-p'), hours: v('f-h'), streams: v('f-s'), date: v('f-d'), evidence: v('f-e') });
  toast(t('saved')); render();
});
window.togglePub = safe(async (val) => { await api('setPublic', { value: val }); render(); });
window.unlock = safe(async () => { S.admin = v('a-s'); sessionStorage.setItem('adm', S.admin); try { await api('a_pending'); } catch (e) { S.admin = ''; sessionStorage.removeItem('adm'); throw e; } render(); });
window.adm = safe(async (a, b) => { await api(a, b); toast(t('saved')); });
window.review = safe(async (rid, approve) => { await api('a_review', { rid, approve }); render(); });

/* ---------- shell ---------- */
async function render() {
  $('#tag').textContent = t('tag');
  $('#lang').textContent = lang === 'th' ? 'EN' : 'ไทย';
  document.documentElement.lang = lang;
  const nav = $('#nav'), main = $('#main');
  if (!S.token && !DEMO) { nav.hidden = true; main.innerHTML = V.auth(); return; }
  if (DEMO && !S.user) S.user = { id: 'demo', username: 'molo2_listener', avatar: '🐰', exp: 600, level: 4, levelName: 'Dedicated Streamer', prevExp: 600, nextExp: 1000, streak: 5, totalHours: 12.5, totalStreams: 2450, public: true, badges: ['first', 'streak5', 'listener', 'dedicated'] };
  nav.hidden = false;
  nav.innerHTML = TABS.map(([k, e]) => `<button class="${S.tab === k || (k === 'profile' && ['ranking', 'admin'].includes(S.tab)) ? 'on' : ''}" onclick="go('${k}')"><span>${e}</span>${t(k)}</button>`).join('');
  try { main.innerHTML = await V[S.tab](); } catch (e) { main.innerHTML = `<div class="card"><p>${esc(e.message)}</p></div>`; }
  window.scrollTo(0, 0);
}
$('#lang').onclick = () => { lang = lang === 'th' ? 'en' : 'th'; localStorage.setItem('lang', lang); render(); };
render();
</script>
</body>
</html>
