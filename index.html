<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOLO#2 STRM HUB</title>
<meta name="theme-color" content="#0b0c10"><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--mute:#5f6272;--blue:#2447d6;--blue2:#5b7bf0;--soft:#dde5ff;--card:#f5f7fc;--line:#e4e9f2;--ok:#2f8f63;--bad:#d63a30;--paper:#fff;--butter:#ffd84d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Nunito","Itim",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
header h1{font-size:17px;font-weight:800}header h1 b{color:var(--blue)}
header p{font-size:12px;color:var(--mute)}
.hgrow{flex:1}
.pill{border:0;background:var(--soft);color:#111;border-radius:99px;padding:8px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
main{flex:1;padding:18px 20px 110px}
h2{font-size:24px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;background:#fff}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card p{color:var(--mute);font-size:14px;line-height:1.5}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0;border-radius:26px;padding:22px}
.hero small{opacity:.85;font-size:12px}.hero .big{font-size:36px;font-weight:800;margin:4px 0 0}.hero .nm{font-size:17px;opacity:.95}
.bar{height:10px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden;margin:8px 0}
.hero .bar{background:rgba(255,255,255,.35)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.hero .bar i{background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:20px;padding:16px}
.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--mute);font-size:13px}.stat .e{font-size:22px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:99px;padding:14px;font:700 15px inherit;font-family:inherit;background:var(--blue);color:#fff;cursor:pointer;text-decoration:none;margin-top:12px}
.btn.soft{background:var(--soft);color:#111}.btn.w{background:#fff;color:#111;display:inline-block;width:auto;padding:14px 28px}
.btn:disabled{opacity:.5}
.tag{background:var(--soft);color:#111;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e3f4ec;color:var(--ok)}.tag.bad{background:#fbe6ec;color:var(--bad)}
.list>div{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:15px inherit;font-family:inherit;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{border:0;border-radius:99px;padding:10px 16px;font:600 14px inherit;font-family:inherit;background:var(--card);color:var(--mute)}.seg .on{background:var(--soft);color:#111}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:14px}
.chart div{flex:1;text-align:center;font-size:12px;color:var(--mute)}.chart i{display:block;background:var(--blue2);border-radius:10px 10px 4px 4px;min-height:6px;margin-bottom:6px}.chart .hi i{background:var(--blue)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;font-size:12px;margin-top:12px}.ach span{display:block;font-size:30px}.ach .lock{opacity:.3;filter:grayscale(1)}
.av{width:96px;height:96px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:48px;margin:6px auto 10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:0;font:600 10px inherit;font-family:inherit;color:var(--mute);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:20px}nav .on{color:#111}
.more{display:flex;gap:10px;justify-content:center;margin-top:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;z-index:9;max-width:90%}
.err{color:var(--bad);font-size:13px;margin-top:10px}
a{color:#111}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button,.btn,.tag,.pill{touch-action:manipulation}
.tag{display:inline-block}
h2,.big,header h1,.card h3{font-family:"Jua","Itim",sans-serif;font-weight:400}
.hero .big{font-weight:400}
.btn,.pill,.tag,nav button,.seg button{transition:transform .12s ease,filter .12s,background .15s}
.btn:active,.pill:active,button.tag:active,a.tag:active,.seg button:active{transform:scale(.94)}
.btn:active{filter:brightness(.94)}
nav button:active{transform:scale(.86)}
.sk{background:linear-gradient(90deg,#f0f3f9 25%,#e6ecf6 37%,#f0f3f9 63%);background-size:400% 100%;animation:sh 1.2s ease infinite;border-radius:22px;margin-bottom:14px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
#bar{position:fixed;top:0;left:0;width:100%;height:3px;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;background:linear-gradient(90deg,transparent,var(--blue),transparent) no-repeat;background-size:40% 100%}
#bar.on{opacity:1;animation:sl 1s linear infinite}
@keyframes sl{from{background-position:-40% 0}to{background-position:140% 0}}

/* ===== black & white line style ===== */
:root{--ink:#14161c;--mute:#6b7080;--blue:#14161c;--blue2:#4a8ef0;--soft:#f1f2f5;--line:#e3e5ea;--butter:#ffe58a;--lav:#dcd9ff;--mint:#cdeedd;--peach:#ffd9bd;--bd:1.25px solid var(--ink)}
body{background:#fff}
svg.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2,.big,header h1,.card h3{font-family:"Poppins","Prompt",sans-serif;font-weight:700}
.card h3{font-weight:600}
header{border-bottom:0;padding:14px 20px 4px}
.logo{background:var(--butter);border:var(--bd);border-radius:16px;color:var(--ink)}
header h1{font-size:15px;line-height:1}
header h1 .chip{display:inline-block;background:var(--ink);color:var(--butter);border-radius:14px;padding:7px 12px;font-size:19px;letter-spacing:.3px}
header h1 small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--mute);font-weight:600;margin:6px 0 0 4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:var(--bd);color:var(--ink)}
main{padding:12px 18px 96px}
.card{border:var(--bd);background:#fff;box-shadow:none;border-radius:22px;padding:14px 16px;margin-bottom:10px}
.hero{background:var(--ink);color:#fff;border-radius:22px}
.hero .big{font-size:26px;font-weight:700;margin:0}
.hero .nm{font-size:13px;font-weight:500;opacity:.8;margin-left:4px;font-family:"Poppins","Prompt",sans-serif}
.hero .bar{background:rgba(255,255,255,.22);margin:10px 0 6px}.hero .bar i{background:var(--butter)}
.stat{background:#fff;border:var(--bd);border-radius:20px;padding:12px 8px;text-align:center}
.stat .n{font-size:18px;font-weight:700}.stat .l{font-size:10.5px;line-height:1.25;color:var(--mute)}
.ico{width:36px;height:36px;border-radius:50%;border:var(--bd);display:grid;place-items:center;background:var(--butter);color:var(--ink);flex:none}
.ico.c2{background:var(--lav)}.ico.c3{background:var(--mint)}.ico.c4{background:var(--peach)}
.stat .ico{margin:0 auto 6px}
.grid{gap:10px;margin-bottom:10px}.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.btn{background:var(--ink);color:#fff;box-shadow:none}
.btn.soft{background:#fff;color:var(--ink);border:var(--bd)}
.btn.w{background:#fff;color:var(--ink)}
.tag{background:var(--soft);color:var(--ink);border:1px solid #14161c33;font-family:inherit}
.tag.ok{background:#d9f3e5;color:#1f6f49;border-color:#1f6f4933}.tag.bad{background:#fde0e6;color:#b3261e;border-color:#b3261e33}
a{color:var(--ink)}.seg .on{background:var(--ink);color:#fff}
input,select{border:1px solid #cfd2da;border-radius:14px;background:#fff}
input:focus,select:focus{outline:0;border-color:var(--ink)}
.list>div{border-bottom:1px dashed #cfd2da}
.av{background:var(--butter);border:var(--bd)}
.bar{height:8px;background:#e8eaef}.bar i{background:var(--blue2)}
.chart i{background:#d5d8e0}.chart .hi i{background:var(--ink)}
.ach span{width:54px;height:54px;border-radius:50%;border:var(--bd);background:var(--butter);display:grid;place-items:center;margin:0 auto 6px;font-size:0}
.ach .lock span{background:#f1f2f5}
nav{bottom:calc(10px + env(safe-area-inset-bottom));width:min(456px,calc(100% - 24px));border:0;border-radius:99px;background:var(--ink);backdrop-filter:none;padding:6px;box-shadow:none}
nav button{color:rgba(255,255,255,.75);border-radius:99px;padding:7px 0}
nav button span{display:grid;place-items:center}
nav .on{background:var(--butter);color:var(--ink)}
:focus-visible{outline:2px solid var(--blue2)}
/* ===== fonts + clean login ===== */
body,h2,.big,header h1,.card h3,.chip,input,select,button,.btn,.tag,.pill,nav button{font-family:"Poppins","Prompt",system-ui,sans-serif}
body{font-size:15px;letter-spacing:.1px;-webkit-font-smoothing:antialiased}
.sub,.card p,label,.stat .l{font-weight:400}
.login header{justify-content:flex-end;padding-top:16px}
.login header .logo,.login header .hgrow{display:none}
.login main{display:flex;flex-direction:column;justify-content:center;padding-bottom:60px}
.login .card{border:0;padding:0;margin:0}
.login label{margin:16px 4px 6px;font-size:13px;font-weight:500;color:var(--ink)}
.login input{padding:16px 18px;border-radius:99px;background:#f6f8fd;border-color:transparent;font-size:16px}
.login input:focus{background:#fff;border-color:var(--blue)}
.login .btn{margin-top:18px;padding:16px;font-weight:600}.login .btn.soft{margin-top:10px}
/* ===== quiet header, no loading effects ===== */
header{padding:16px 20px 0}
header h1 .chip{background:none;color:var(--ink);padding:0;border-radius:0;font-size:24px;letter-spacing:-.3px;box-shadow:inset 0 -9px 0 var(--butter)}
#bar,.sk{display:none!important}
/* ===== pure black & white ===== */
:root{--ink:#111;--mute:#6b6b70;--blue:#111;--blue2:#111;--soft:#f2f2f3;--card:#fff;--line:#e4e4e6;--ok:#111;--bad:#111;--butter:#ececee;--lav:#f2f2f3;--mint:#f2f2f3;--peach:#f2f2f3}
body,main,header{background:#fff}
.ico,.ico.c2,.ico.c3,.ico.c4,.av,.logo,.ach span{background:#f2f2f3}
.ach .lock span{background:#fff}
.av{filter:grayscale(1)}
header h1 .chip{box-shadow:inset 0 -9px 0 #e4e4e6}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:#fff}
.bar{background:#e4e4e6}.bar i{background:#111}
.tag,.pill,.btn.soft,.seg .on,a,nav .on{color:#111}
.tag{background:#f2f2f3}
.tag.ok{background:#111;color:#fff;border-color:#111}

nav .on{background:#fff;color:#111}
.chart i{background:#d9d9dc}.chart .hi i{background:#111}
input:focus,select:focus{border-color:#111;box-shadow:none}
:focus-visible{outline:2px solid #111}
.err,.msg{color:#111}
/* ===== songs + platforms ===== */
.sec{font:700 16px "Poppins","Prompt",sans-serif;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:4px;height:18px;border-radius:4px;background:#111}
.songs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.song{border:var(--bd);border-radius:18px;padding:8px;text-align:center;background:#fff;min-width:0}
.cov{aspect-ratio:1;border-radius:12px;background:#f2f2f3;display:grid;place-items:center;overflow:hidden;margin-bottom:6px}
.cov img{width:100%;height:100%;object-fit:cover}
.song b{display:block;font-size:11px;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sm{display:block;width:auto;padding:6px 0;font-size:11px;text-align:center;text-decoration:none;border-radius:99px}
.pfs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.pfs::-webkit-scrollbar{display:none}
.pf{flex:0 0 118px;border:var(--bd);border-radius:20px;padding:12px;background:#fff;color:#111;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.pf b{font-size:13px}.pf span{font-size:12px;font-weight:500;display:inline-flex;gap:4px;align-items:center}
/* ===== colour accents, docked nav, level journey ===== */
:root{--butter:#ffe58a;--lav:#e6e1ff;--mint:#d5f1e3;--peach:#ffdccb;--blue2:#4a8ef0;--ok:#157347;--bad:#c4372d}

a{color:#2447d6}

    const rw = 'style="justify-content:flex-start;gap:12px"';
    return `<p class="sub" style="margin:0 0 2px;font-size:12px">${esc(fmtDate(d.date))}</p><h2 style="font-size:22px;margin:0 0 10px">${t('welcome')}</h2>
    <div class="grid g4">${st('', 'clock', u.totalHours, t('hours'))}${st('c2', 'music', u.totalStreams.toLocaleString(), t('streams'))}${st('c3', 'bolt', u.exp, t('totalExp'))}${st('c4', 'flame', u.streak, t('streak'))}</div>
    <div class="card feat"><div class="row"><div class="row" ${rw}><div class="ico">${ic('music', 18)}</div><div><b>${esc(d.playlist ? d.playlist.title : t('none'))}</b><p>${t('todayPl')} · Spotify</p></div></div>${d.playlist ? `<a class="tag" href="${safeUrl(d.playlist.url)}" target="_blank" rel="noopener">${t('open')}</a>` : ''}</div></div>
    <div class="card"><div class="row"><div class="row" ${rw}><div class="ico c2">${ic('radio', 18)}</div><div><b>Stationhead</b><p>${t('join')}</p></div></div><button class="tag" onclick="go('station')">${t('open')}</button></div></div>
    <h3 class="sec">MARK's Songs</h3>
    <div class="songs">${SONGS.map((x) => `<div class="song"><div class="cov">${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy">` : ic('music', 22)}</div><b>${esc(x.t)}</b><a class="btn sm" href="${safeUrl(x.url)}" target="_blank" rel="noopener">Stream</a></div>`).join('')}</div>
    <div class="card pfc"><div class="row"><h3 class="sec nob">${ic('music', 20)} Streaming Platforms</h3><button class="tag" onclick="this.closest('.pfc').classList.toggle('all')">View all ${ic('arrow', 12)}</button></div>
    <div class="pfs">${HUB_PF.map((x) => `<a class="pf" href="${safeUrl(x.url)}" target="_blank" rel="noopener"><svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">${PF_LOGO[x.l]}</svg><b>${x.n}</b><em>${x.kr ? 'KR Digital Chart' : '&nbsp;'}</em><span>Stream ${ic('arrow', 12)}</span></a>`).join('')}</div></div>`;
  },
  async playlist() {
    const [d, s] = await Promise.all([api('today'), api('schedule')]);
    return `<h2>${esc(fmtDate(d.date).split(',')[0])}</h2><p class="sub">${t('todayPl')}</p>
    <div class="card"><div class="row" style="gap:14px;justify-content:flex-start"><div class="logo" style="width:64px;height:64px">${ic('headphones', 30)}</div><div><p>Spotify</p><h3>${esc(d.playlist ? d.playlist.title : t('none'))}</h3></div></div>
      ${d.playlist ? `<a class="btn" href="${safeUrl(d.playlist.url)}" target="_blank" rel="noopener">${t('openSpotify')} ↗</a>` : ''}</div>
    <div class="card"><h3>${t('schedule')}</h3><div class="list">${s.items.map((i, n) => `<div><div><b>${i.date.slice(5)}</b><p>${esc(i.title || t('notSet'))}</p></div><span class="tag">${n ? t('upcoming') : t('today')}</span></div>`).join('')}</div></div>
    <div class="card"><h3>${t('howStream')}</h3><p>${t('howStreamTxt')}</p></div>`;
  },
  async station() {
    const d = await api('today');
    return `<h2>Stationhead</h2><p class="sub">${t('join')}</p>
    <div class="card hero" style="text-align:center"><div style="display:grid;place-items:center">${ic('radio', 52)}</div><div class="big" style="font-size:26px">MARK LEE STATION</div><p style="color:#fff;opacity:.9;margin:6px 0 16px">Listen together. Support together.</p>
      ${d.room ? `<a class="btn w" href="${safeUrl(d.room)}" target="_blank" rel="noopener">${t('join')} ↗</a>` : ''}</div>
    <div class="card"><h3>${t('how')}</h3><div class="list"><div><span>1 · ${t('s1')}</span></div><div><span>2 · ${t('s2')}</span></div><div><span>3 · ${t('s3')}</span></div></div></div>
    <div class="card"><h3>${t('room')}</h3><p>${d.room ? esc(d.room) : t('roomNone')}</p>${d.room ? `<a class="btn soft" href="${safeUrl(d.room)}" target="_blank" rel="noopener">${t('openRoom')} ↗</a>` : ''}</div>`;
  },
  async missions() {
    const m = await api('missions');
    const w = m.weekly;
    const mc = (title, desc, exp, body) => `<div class="card"><div class="row"><h3>${title}</h3><span class="tag">+${exp} EXP</span></div><p>${desc}</p>${body}</div>`;
    const done = `<span class="tag ok" style="display:inline-block;margin-top:12px">✓ ${t('done')}</span>`;
    return `<h2>${t('missions')}</h2><p class="sub">Little steps, more EXP.</p>
    ${mc(t('checkin'), t('checkinD'), 10, m.checkin ? done : `<button class="btn soft" onclick="doCheckin(this)">${t('doCheckin')}</button>`)}
    ${mc(t('plM'), t('plD'), 20, m.playlist.done ? done : `<button class="btn soft" ${m.playlist.available ? '' : 'disabled'} onclick="doAct('claimPlaylist',this)">${t('claim')}</button>`)}
    ${mc(t('wkM'), t('wkD'), 100, `<div class="bar"><i style="width:${Math.min(100, (w.days / w.target) * 100)}%"></i></div><p>${w.days} / ${w.target} ${t('days')}</p>${w.claimed ? done : `<button class="btn soft" ${w.days >= w.target ? '' : 'disabled'} onclick="doAct('claimWeekly',this)">${t('claim')}</button>`}`)}
    ${mc(t('spM'), esc(m.special || t('noSpecial')), 200, '')}`;
  },
  async stats() {
    const s = await api('stats');
    const max = Math.max(1, ...s.week), dn = T[lang].days7;
    const wd = (new Date(Date.now() + 7 * 36e5).getUTCDay() + 6) % 7;
    const st = { pending: 'tag', approved: 'tag ok', rejected: 'tag bad' };
    return `<h2>${t('stats')}</h2><p class="sub"></p>
    <div class="grid"><div class="stat"><div class="l">${t('hours')}</div><div class="n">${s.totalHours}</div></div><div class="stat"><div class="l">${t('streams')}</div><div class="n">${s.totalStreams.toLocaleString()}</div></div></div>
    <div class="card"><h3>${t('weeklyAct')}</h3><div class="chart">${s.week.map((h, i) => `<div class="${i === wd ? 'hi' : ''}"><i style="height:${(h / max) * 110}px" title="${h}h"></i>${dn[i]}</div>`).join('')}</div></div>
    <div class="card"><h3>${t('submit')}</h3><p>${t('submitD')}</p>
      <label for="f-p">${t('platform')}</label><select id="f-p">${['Spotify', 'Apple Music', 'YouTube Music', 'Stationhead', 'Other'].map((p) => `<option>${p}</option>`).join('')}</select>
      <label for="f-h">${t('sh')}</label><input id="f-h" type="number" inputmode="decimal" min="0.1" max="24" step="0.1" placeholder="2">
      <label for="f-s">${t('rs')}</label><input id="f-s" type="number" inputmode="numeric" min="0" placeholder="150">
      <label for="f-d">${t('date')}</label><input id="f-d" type="date" value="${thaiToday()}" max="${thaiToday()}">
      <label for="f-e">${t('ev')}</label><input id="f-e" type="url" placeholder="https://">
      <button class="btn" onclick="sendRec(this)">${t('send')}</button></div>
    <div class="card"><h3>${t('recent')}</h3><div class="list">${s.recent.length ? s.recent.map((r) => `<div><div><b>${esc(r.platform)} · ${r.hours}h</b><p>${esc(r.date)} · ${r.streams} streams</p></div><span class="${st[r.status]}">${t(r.status)}</span></div>`).join('') : `<p>${t('noRec')}</p>`}</div></div>`;
  },
  async profile() {
    const m = await api('me'); const u = (S.user = m.user);
    return `<div class="av">${esc(u.avatar)}</div><h2 style="text-align:center">${esc(u.username)}</h2><p class="sub" style="text-align:center">MOLO2 Streamer · <span class="tag">LV.${u.level} · ${esc(lvName(u.level))}</span></p>
    <div class="card"><div class="row"><span>${u.exp} EXP</span><span>${u.nextExp ?? '—'} EXP</span></div><div class="bar"><i style="width:${pct(u)}%"></i></div></div>
    ${journey(u.level)}
    <div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat" style="text-align:center"><div class="ico ">${ic('medal', 18)}</div><div class="n">${u.badges.length}</div><div class="l">${t('badges')}</div></div><div class="stat" style="text-align:center"><div class="ico c2">${ic('flame', 18)}</div><div class="n">${u.streak}</div><div class="l">${t('streak')}</div></div><div class="stat" style="text-align:center"><div class="ico c3">${ic('clock', 18)}</div><div class="n">${u.totalHours}</div><div class="l">${t('hrs')}</div></div></div>
    <div class="card"><h3>${t('ach')}</h3><div class="ach">${ACH.map(([k, e]) => `<div class="${u.badges.includes(k) ? '' : 'lock'}"><span>${ic(e, 26)}</span>${t('ach_' + k)}</div>`).join('')}</div></div>
    <div class="card"><h3>${t('acc')}</h3><div class="list"><div><span>${t('pub')}</span><button class="tag" style="border:0" onclick="togglePub(${!u.public})">${u.public ? t('on') : t('off')}</button></div></div>
      <button class="btn soft" onclick="logout()">${t('logout')}</button></div>
    <div class="more"><button class="pill" onclick="go('ranking')">${ic('trophy', 14)} ${t('ranking')}</button>${u.isAdmin ? `<button class="pill" onclick="go('admin')">${ic('gear', 14)} ${t('admin')}</button>` : ''}</div>`;
  },
  async ranking() {
    const r = await api('ranking');
    return `<h2>${t('ranking')}</h2><p class="sub"></p><div class="card"><div class="list">${r.items.length ? r.items.map((x) => `<div><span>${x.rank}. ${esc(x.avatar)} <b>${esc(x.username)}</b></span><span class="tag">${x.exp} EXP · Lv ${x.level}</span></div>`).join('') : `<p>${t('empty')}</p>`}</div></div>`;
  },
  async admin() {
    if (!S.user) S.user = (await api('me')).user;
    if (!S.user.isAdmin) return `<h2>${t('admin')}</h2><div class="card"><p>Admin only.</p></div>`;
    const p = await api('a_pending');
    return `<h2>${t('admin')}</h2><p class="sub"></p>
    <div class="card"><h3>${t('aPl')}</h3><label for="a-d">${t('date')}</label><input id="a-d" type="date" value="${thaiToday()}"><label for="a-t">${t('aTitle')}</label><input id="a-t" value="MARK LEE — Daily Stream"><label for="a-u">${t('aUrl')}</label><input id="a-u" type="url"><button class="btn" onclick="adm('a_setPlaylist',{date:v('a-d'),title:v('a-t'),url:v('a-u')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aRoom')}</h3><input id="a-r" type="url" placeholder="https://"><button class="btn" onclick="adm('a_setRoom',{url:v('a-r')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aSpecial')}</h3><input id="a-x"><button class="btn" onclick="adm('a_setSpecial',{text:v('a-x')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aPend')}</h3><div class="list">${p.items.length ? p.items.map((r) => `<div><div><b>${esc(r.uid)} · ${esc(r.platform)} · ${r.hours}h</b><p>${esc(r.date)} · ${r.streams} streams${/^https:\/\//.test(r.evidence) ? ` · <a href="${safeUrl(r.evidence)}" target="_blank" rel="noopener">link</a>` : ''}</p></div><div style="display:flex;gap:6px"><button class="tag ok" style="border:0" onclick="review('${esc(r.rid)}',true)">${t('approve')}</button><button class="tag bad" style="border:0" onclick="review('${esc(r.rid)}',false)">${t('reject')}</button></div></div>`).join('') : `<p>${t('empty')}</p>`}</div></div>`;
  },
  auth() {
    return `<div class="card">
    <label for="u">${t('user')}</label><input id="u" autocomplete="username" autocapitalize="none" placeholder="@twitter"><label for="p">${t('pin')}</label><input id="p" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password">
    <button class="btn" onclick="auth('login')">${t('login')}</button><button class="btn soft" onclick="auth('register')">${t('register')}</button><div class="err" id="err" role="alert"></div></div>`;
  },
};

/* ---------- actions ---------- */
const v = (id) => $('#' + id).value.trim();
window.go = (tab) => { S.tab = tab; render(); };
window.logout = logout;
window.auth = async (kind) => {
  try { const r = await api(kind, { username: v('u'), pin: v('p') }); S.token = r.token; S.user = r.user; localStorage.setItem('tok', r.token); S.tab = 'home'; render(); }
  catch (e) { $('#err').textContent = e.message; }
};
window.doCheckin = safe(async (el) => { lock(el); const r = await api('checkin'); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.doAct = safe(async (a, el) => { lock(el); const r = await api(a); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.sendRec = safe(async (el) => {
  lock(el);
  await api('submitRecord', { platform: v('f-p'), hours: v('f-h'), streams: v('f-s'), date: v('f-d'), evidence: v('f-e') });
  toast(t('saved')); render(true);
});
window.togglePub = safe(async (val) => { await api('setPublic', { value: val }); render(); });
window.unlock = safe(async () => { S.admin = v('a-s'); sessionStorage.setItem('adm', S.admin); try { await api('a_pending'); } catch (e) { S.admin = ''; sessionStorage.removeItem('adm'); throw e; } render(); });
window.adm = safe(async (a, b) => { await api(a, b); toast(t('saved')); });
window.review = safe(async (rid, approve) => { await api('a_review', { rid, approve }); render(); });

/* ---------- shell ---------- */
const HC = (() => { try { return JSON.parse(sessionStorage.getItem('hc') || '{}'); } catch { return {}; } })(); // rendered HTML per tab: shown instantly, refreshed in background
let warmed = false, shown = '', gen = 0;
const clearHC = () => { for (const k in HC) delete HC[k]; warmed = false; try { sessionStorage.removeItem('hc'); } catch {} };
const SKEL = '';
function warm() {
  if (warmed || DEMO || !S.token) return;
  warmed = true;
  setTimeout(async () => {
    for (const k of ['playlist', 'missions', 'stats']) {
      const key = k + lang;
      try { if (!HC[key] && S.token) HC[key] = await V[k](); } catch {}
    }
  }, 600);
}
async function render(force) {
  $('#lang').textContent = lang === 'th' ? 'EN' : 'ไทย';
  document.documentElement.lang = lang;
  document.body.classList.toggle('login', !S.token && !DEMO);
  const nav = $('#nav'), main = $('#main');
  if (!S.token && !DEMO) { nav.hidden = true; main.innerHTML = V.auth(); shown = 'auth'; return; }
  if (DEMO && !S.user) S.user = { id: 'demo', username: 'molo2_listener', avatar: '🐰', exp: 600, level: 4, levelName: 'Dedicated Streamer', prevExp: 600, nextExp: 1000, streak: 5, totalHours: 12.5, totalStreams: 2450, public: true, badges: ['first', 'streak5', 'listener', 'dedicated'] };
  nav.hidden = false;
  if (nav.dataset.l !== lang) { nav.innerHTML = TABS.map(([k, e]) => `<button data-k="${k}" onclick="go('${k}')"><span>${ic(e, 20)}</span>${t(k)}</button>`).join(''); nav.dataset.l = lang; }
  [...nav.children].forEach((b) => b.classList.toggle('on', b.dataset.k === S.tab || (b.dataset.k === 'profile' && ['ranking', 'admin'].includes(S.tab))));
  const tab = S.tab, key = tab + lang, my = ++gen;
  if (shown !== key) { main.innerHTML = HC[key] || SKEL; window.scrollTo(0, 0); shown = key; }
  let html;
  try { html = await V[tab](); } catch (e) { html = `<div class="card"><p>${esc(e.message)}</p></div>`; }
  if (my !== gen) return;
  const typing = !force && /INPUT|SELECT/.test((document.activeElement || {}).tagName || '');
  if (HC[key] !== html && !typing) main.innerHTML = html;
  HC[key] = html;
  try { sessionStorage.setItem('hc', JSON.stringify(HC)); } catch {}
  warm();
}
$('#lang').onclick = () => { lang = lang === 'th' ? 'en' : 'th'; localStorage.setItem('lang', lang); render(); };
render();
</script>
</body>
</html>
