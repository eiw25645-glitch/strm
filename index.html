<style>
:root{--ink:#141414;--mute:#5f6272;--blue:#2447d6;--blue2:#5b7bf0;--soft:#dde5ff;--card:#f5f7fc;--line:#e4e9f2;--ok:#2f8f63;--bad:#d63a30;--paper:#fff;--butter:#ffd84d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Rubik","Anuphan",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
header h1{font-size:17px;font-weight:800}header h1 b{color:var(--blue)}
header p{font-size:12px;color:var(--mute)}
.hgrow{flex:1}
.pill{border:0;background:var(--soft);color:#111;border-radius:99px;padding:8px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
main{flex:1;padding:18px 20px 110px}
h2{font-size:24px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;background:#fff}

.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{border:0;border-radius:99px;padding:10px 16px;font:600 14px inherit;font-family:inherit;background:var(--card);color:var(--mute)}.seg .on{background:var(--soft);color:#111}

.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;font-size:12px;margin-top:12px}.ach span{display:block;font-size:30px}.ach .lock{opacity:.3;filter:grayscale(1)}

nav button{flex:1;border:0;background:0;font:600 10px inherit;font-family:inherit;color:var(--mute);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:20px}nav .on{color:#111}
.more{display:flex;gap:10px;justify-content:center;margin-top:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;z-index:9;max-width:90%}
.err{color:var(--bad);font-size:13px;margin-top:10px}
a{color:#111}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button,.btn,.tag,.pill{touch-action:manipulation}
.tag{display:inline-block}
h2,.big,header h1,.card h3{font-family:"Rubik","Anuphan",sans-serif;font-weight:400}
.hero .big{font-weight:400}
.btn,.pill,.tag,nav button,.seg button{transition:transform .12s ease,filter .12s,background .15s}
.btn:active,.pill:active,button.tag:active,a.tag:active,.seg button:active{transform:scale(.94)}
.btn:active{filter:brightness(.94)}
nav button:active{transform:scale(.86)}
.sk{background:linear-gradient(90deg,#f0f3f9 25%,#e6ecf6 37%,#f0f3f9 63%);background-size:400% 100%;animation:sh 1.2s ease infinite;border-radius:22px;margin-bottom:14px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
#bar{position:fixed;top:0;left:0;width:100%;height:3px;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;background:linear-gradient(90deg,transparent,var(--blue),transparent) no-repeat;background-size:40% 100%}
#bar.on{opacity:1;animation:sl 1s linear infinite}
@keyframes sl{from{background-position:-40% 0}to{background-position:140% 0}}

const TTL = { today: 60e3, schedule: 60e3, ranking: 30e3 }, MEM = {};

let pending = 0;
const bar = (d) => { pending += d; $('#bar').classList.toggle('on', pending > 0); };
async function api(action, body = {}) {
  const ttl = TTL[action];
  if (ttl && MEM[action] && Date.now() - MEM[action].t < ttl) return MEM[action].v;
  bar(1);
  try {
    const v = await rawApi(action, body);
    if (ttl) MEM[action] = { t: Date.now(), v };
    if (action.startsWith('a_set')) { delete MEM.today; delete MEM.schedule; }
    if (!READ.has(action)) clearHC();
    return v;
  } finally { bar(-1); }
}
async function rawApi(action, body = {}) {
  if (DEMO) { const f = MOCK[action]; return f ? f() : { ok: true, user: S.user, gained: 10 }; }
  const r = await fetch('/api/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token, 'x-admin-secret': S.admin }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({ error: 'Server error' }));
  if (!r.ok) { if (r.status === 401 && S.token) { logout(); } throw new Error(j.error || 'Error'); }
  return j;
}

};

    const p = await api('a_pending');
    return `<h2>${t('admin')}</h2><p class="sub"></p>
    <div class="card"><h3>${t('aPl')}</h3><label for="a-d">${t('date')}</label><input id="a-d" type="date" value="${thaiToday()}"><label for="a-t">${t('aTitle')}</label><input id="a-t" value="MARK LEE — Daily Stream"><label for="a-u">${t('aUrl')}</label><input id="a-u" type="url"><button class="btn" onclick="adm('a_setPlaylist',{date:v('a-d'),title:v('a-t'),url:v('a-u')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aRoom')}</h3><input id="a-r" type="url" placeholder="https://"><button class="btn" onclick="adm('a_setRoom',{url:v('a-r')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aSpecial')}</h3><input id="a-x"><button class="btn" onclick="adm('a_setSpecial',{text:v('a-x')})">${t('save')}</button></div>
    <div class="card"><h3>${t('aPend')}</h3><div class="list">${p.items.length ? p.items.map((r) => `<div><div><b>${esc(r.uid)} · ${esc(r.platform)} · ${r.hours}h</b><p>${esc(r.date)} · ${r.streams} streams${/^https:\/\//.test(r.evidence) ? ` · <a href="${safeUrl(r.evidence)}" target="_blank" rel="noopener">link</a>` : ''}</p></div><div style="display:flex;gap:6px"><button class="tag ok" style="border:0" onclick="review('${esc(r.rid)}',true)">${t('approve')}</button><button class="tag bad" style="border:0" onclick="review('${esc(r.rid)}',false)">${t('reject')}</button></div></div>`).join('') : `<p>${t('empty')}</p>`}</div></div>`;
  },
  auth() {
    return `<div class="card">
    <label for="u">${t('user')}</label><input id="u" autocomplete="username" autocapitalize="none" placeholder="@twitter"><label for="p">${t('pin')}</label><input id="p" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password">
    <button class="btn" onclick="auth('login')">${t('login')}</button><button class="btn soft" onclick="auth('register')">${t('register')}</button><div class="err" id="err" role="alert"></div></div>`;
  },
};

/* ---------- actions ---------- */
const v = (id) => $('#' + id).value.trim();
window.go = (tab) => { S.tab = tab; render(); };
window.logout = logout;
window.auth = async (kind) => {
  const bt = [...document.querySelectorAll('.login .btn')]; bt.forEach((b) => { b.disabled = true; b.style.opacity = '.6'; });
  try { const r = await api(kind, { username: v('u'), pin: v('p') }); S.token = r.token; S.user = r.user; localStorage.setItem('tok', r.token); S.tab = 'home'; render(); }
  catch (e) { $('#err').textContent = e.message; bt.forEach((b) => { b.disabled = false; b.style.opacity = ''; }); }
};
window.doCheckin = safe(async (el) => { lock(el); const r = await api('checkin'); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.doAct = safe(async (a, el) => { lock(el); const r = await api(a); toast(r.already ? t('already') : t('gained', r.gained)); render(); });
window.sendRec = safe(async (el) => {
  lock(el);
  await api('submitRecord', { platform: v('f-p'), hours: v('f-h'), streams: v('f-s'), date: v('f-d'), evidence: v('f-e') });
  toast(t('saved')); render(true);
});
window.togglePub = safe(async (val) => { await api('setPublic', { value: val }); render(); });
window.unlock = safe(async () => { S.admin = v('a-s'); sessionStorage.setItem('adm', S.admin); try { await api('a_pending'); } catch (e) { S.admin = ''; sessionStorage.removeItem('adm'); throw e; } render(); });
window.adm = safe(async (a, b) => { await api(a, b); toast(t('saved')); });
window.review = safe(async (rid, approve) => { await api('a_review', { rid, approve }); render(); });

/* ---------- shell ---------- */
const HC = (() => { try { return JSON.parse(sessionStorage.getItem('hc') || '{}'); } catch { return {}; } })(); // rendered HTML per tab: shown instantly, refreshed in background
let warmed = false, shown = '', gen = 0;
const clearHC = () => { for (const k in HC) delete HC[k]; warmed = false; try { sessionStorage.removeItem('hc'); } catch {} };
const SKEL = '<div class="skl"></div><div class="skl"></div><div class="skl s"></div>';
function warm() {
  if (warmed || DEMO || !S.token) return;
  warmed = true;
  setTimeout(async () => {
    for (const k of ['playlist', 'missions', 'stats', 'station']) {
      const key = k + lang;
      try { if (!HC[key] && S.token) HC[key] = await V[k](); } catch {}
    }
  }, 600);
}
async function render(force) {
  $('#lang').textContent = lang === 'th' ? 'EN' : 'ไทย';
  document.documentElement.lang = lang;
  document.body.classList.toggle('login', !S.token && !DEMO);
  document.body.classList.toggle('nothome', S.tab !== 'home');
  const nav = $('#nav'), main = $('#main');
  if (!S.token && !DEMO) { nav.hidden = true; main.innerHTML = V.auth(); shown = 'auth'; return; }
  if (DEMO && !S.user) S.user = { id: 'demo', username: 'molo2_listener', avatar: '🐰', exp: 600, level: 4, levelName: 'Dedicated Streamer', prevExp: 600, nextExp: 1000, streak: 5, totalHours: 12.5, totalStreams: 2450, public: true, badges: ['first', 'streak5', 'listener', 'dedicated'] };
  nav.hidden = false;
  if (nav.dataset.l !== lang) { nav.innerHTML = TABS.map(([k, e]) => `<button data-k="${k}" onclick="go('${k}')"><span>${ic(e, 20)}</span>${t(k)}</button>`).join(''); nav.dataset.l = lang; }
  [...nav.children].forEach((b) => b.classList.toggle('on', b.dataset.k === S.tab || (b.dataset.k === 'home' && S.tab === 'station') || (b.dataset.k === 'profile' && ['ranking', 'admin'].includes(S.tab))));
  const tab = S.tab, key = tab + lang, my = ++gen;
  if (shown !== key) { main.innerHTML = HC[key] || SKEL; window.scrollTo(0, 0); shown = key; }
  let html;
  try { html = await V[tab](); } catch (e) { html = `<div class="card"><p>${esc(e.message)}</p></div>`; }
  if (my !== gen) return;
  const typing = !force && /INPUT|SELECT/.test((document.activeElement || {}).tagName || '');
  if (HC[key] !== html && !typing) main.innerHTML = html;
  HC[key] = html;
  try { sessionStorage.setItem('hc', JSON.stringify(HC)); } catch {}
  warm();
}
let theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = theme === 'light' ? '#ffffff' : '#1d1c21';
  const b = $('#theme'); b.innerHTML = ic(theme === 'light' ? 'moon' : 'sun', 18);
  b.setAttribute('aria-label', theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
}
$('#theme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem('theme', theme); } catch {} applyTheme(); };
applyTheme();
$('#lang').onclick = () => { lang = lang === 'th' ? 'en' : 'th'; localStorage.setItem('lang', lang); render(); };

/* press feedback: pointerdown adds .pr, removed shortly after release */
(() => {
  const SEL = 'nav button,button,a[href],[role=button],.btn,.pill,.tag,.tr,.pf,.ytv,.go,.seg button,.card.feat';
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest && e.target.closest(SEL);
    if (!el || el.disabled) return;
    el.classList.add('pr'); el._t = Date.now();
    const off = () => { const w = Math.max(0, 140 - (Date.now() - el._t)); setTimeout(() => el.classList.remove('pr'), w); };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((n) => el.addEventListener(n, off, { once: true }));
  }, { passive: true });
})();
render();
</script>
</body>
</html>
