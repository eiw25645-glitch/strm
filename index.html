<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Molo2 streaming hub for MARK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--mute:#8a8a93;--line:#111;--grey:#efeff1;--grey2:#e3e3e7;--bd:1.5px solid #111;--ease:cubic-bezier(.22,.7,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Poppins","Prompt",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;animation:fade .7s var(--ease) both;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;background:var(--grey);z-index:0;pointer-events:none}
body:before{width:300px;height:300px;right:-120px;top:-110px}
body:after{width:240px;height:240px;left:-130px;bottom:-90px}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 20px 130px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rv{animation:rise .65s var(--ease) both;animation-delay:calc(var(--d,0)*110ms)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 0 6px}
.hero small{display:block;font-size:17px;font-weight:300;letter-spacing:.2px}
.hero h1{font-size:50px;font-weight:800;line-height:1;letter-spacing:-1.5px;margin:2px 0 6px}
.hero p{font-size:15px;font-weight:400;color:#55555e}
.hero img{width:62px;height:auto;display:block;margin-bottom:4px}
.sec{margin-top:26px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:19px;font-weight:700;letter-spacing:-.2px}
.sh a{color:var(--ink);font-size:13px;font-weight:500;text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.card{background:#fff;border:var(--bd);border-radius:26px}
.feat{display:flex;gap:14px;padding:12px;align-items:center;margin-bottom:12px}
.cv{position:relative;flex:none;border-radius:18px;overflow:hidden;border:var(--bd);background:#fff}
.cv img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.feat .cv{width:128px}
.feat .tx{flex:1;min-width:0}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.8px;border-radius:99px;padding:5px 11px;background:var(--ink);color:#fff}
.feat h3{font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.6px;margin:9px 0 3px}
.vw{font-size:12px;color:var(--mute);min-height:17px}
.go{display:flex;justify-content:center;align-items:center;gap:6px;text-decoration:none;border:0;cursor:pointer;font:500 14px "Poppins","Prompt",sans-serif;color:#fff;background:var(--ink);border-radius:99px;padding:11px 14px;margin-top:9px;transition:transform .12s}
.go svg.i{width:15px;height:15px;stroke-width:2.2}
.go:active{transform:scale(.95)}
.go[aria-disabled=true]{background:var(--grey2);color:#9a9aa3;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sg{padding:10px;text-align:center}
.sg .cv{border-radius:16px}
.sg b{display:block;font-size:15px;font-weight:600;margin:10px 0 1px}
.rk{position:absolute;left:8px;top:8px;background:#fff;border:var(--bd);border-radius:99px;font-size:10.5px;font-weight:600;padding:1px 8px}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pf{flex:none;width:122px;padding:16px 6px 14px;text-align:center;scroll-snap-align:start;text-decoration:none;color:inherit;transition:transform .15s}
.pf:active{transform:scale(.96)}
.ic{width:54px;height:54px;border-radius:50%;background:#fff;border:var(--bd);display:grid;place-items:center;margin:0 auto 10px;color:var(--ink)}
.pf.on .ic{background:var(--ink);color:#fff}
svg.i{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pf b{display:block;font-size:14px;font-weight:600}
.pf small{display:block;font-size:9.5px;color:var(--mute);margin-top:1px}
.pf .s{display:block;margin-top:6px;font-size:12px;font-weight:500}
.pf.off{border-color:#c9c9cf;border-style:dashed;pointer-events:none}
.pf.off .ic{border-color:#c9c9cf;color:#b5b5bc}
.pf.off b,.pf.off .s{color:#a5a5ad}
.ev{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:12px}
.ev .ic{margin:0;width:48px;height:48px;flex:none;background:var(--ink);color:#fff;border:0}
.ev:nth-child(even) .ic{background:var(--grey2);color:var(--ink)}
.ev .tx{flex:1;min-width:0}.ev b{font-size:15px;font-weight:600}.ev p{font-size:12.5px;color:var(--mute);margin-top:2px}
.ev .go{margin:0;padding:9px 18px;white-space:nowrap}
.lv{padding:18px 18px 16px;background:var(--ink);color:#fff;border:0}
.lv .t{display:flex;justify-content:space-between;align-items:baseline}
.lv .t b{font-size:36px;font-weight:800;letter-spacing:-1px}.lv .t span{font-size:12.5px;opacity:.7}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.22);margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transform-origin:left;animation:grow 1.1s .5s var(--ease) both}
.lv small{display:block;font-size:13px;opacity:.85;font-weight:400}
.jr{padding:16px 8px 16px;text-align:center}
.jg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 0}
.jb{padding:8px 0 6px;border-radius:20px;border:1.5px solid transparent;font-size:11.5px;font-weight:500;color:var(--mute)}
.jb.on{background:var(--grey);border-color:var(--ink);color:var(--ink);font-weight:700}
.jc{position:relative;width:46px;height:46px;margin:0 auto 9px;border-radius:50%;background:var(--grey);border:1.5px solid #d4d4da;color:#a2a2aa;display:grid;place-items:center}
.jc svg.i{width:22px;height:22px}
.jb.on .jc{background:var(--ink);border-color:var(--ink);color:#fff}
.jc em{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font:600 9px "Poppins",sans-serif;font-style:normal;background:#fff;color:var(--mute);border:1.5px solid #d4d4da;border-radius:99px;padding:0 6px}
.jb.on .jc em{color:var(--ink);border-color:var(--ink)}
.jr p{margin-top:14px;font-size:14px;font-weight:600;letter-spacing:-.1px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(456px,calc(100% - 24px));z-index:5;display:flex;background:var(--ink);border-radius:99px;padding:6px}
nav button{flex:1;border:0;background:0;font:500 10.5px "Poppins","Prompt",sans-serif;color:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:99px;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease)}
nav .on{background:#fff;color:var(--ink)}
nav svg.i{width:21px;height:21px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:9;animation:fade .3s both}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== compact sizing ===== */
#app{padding:calc(18px + env(safe-area-inset-top)) 16px 96px}
.hero{padding:0}
.hero small{font-size:14px}
.hero h1{font-size:38px;letter-spacing:-1.2px;margin:0 0 4px}
.hero p{font-size:13px}
.hero img{width:48px}
.sec{margin-top:18px}
.sh{margin-bottom:9px}
.sh h2{font-size:16px}
.sh a{font-size:12px}
.card{border-radius:20px}
.feat{gap:12px;padding:10px;margin-bottom:8px}
.feat .cv{width:92px;border-radius:14px}
.tag{font-size:9.5px;padding:4px 9px}
.feat h3{font-size:22px;margin:7px 0 2px}
.vw{font-size:11.5px;min-height:0}
.vw:empty{display:none}
.go{font-size:13px;padding:8px 12px;margin-top:7px}
.go svg.i{width:13px;height:13px}
.two{grid-template-columns:1fr;gap:8px}
.sg{display:flex;align-items:center;gap:12px;padding:8px 10px;text-align:left}
.sg .cv{width:56px;border-radius:12px}
.sg .tx{flex:1;min-width:0}
.sg b{font-size:15px;margin:0}
.rk2{display:block;font-size:10.5px;font-weight:600;color:var(--mute);letter-spacing:.4px}
.sg .go{margin:0;padding:7px 13px;font-size:12.5px}
.row{margin:0 -16px;padding:2px 16px 2px;gap:10px;scroll-padding-left:16px}
.pf{width:98px;padding:12px 4px 11px}
.ic{width:42px;height:42px;margin-bottom:7px}
svg.i{width:20px;height:20px}
.pf b{font-size:12.5px}
.pf small{font-size:8.5px}
.pf .s{margin-top:4px;font-size:11px}
.ev{gap:12px;padding:10px 12px;margin-bottom:8px}
.ev .ic{width:40px;height:40px}
.ev b{font-size:14px}
.ev p{font-size:11.5px;margin-top:1px}
.ev .go{padding:7px 15px;font-size:12.5px}
.lv{padding:14px 16px 13px}
.lv .t b{font-size:28px}
.lv .t span{font-size:11.5px}
.bar{height:7px;margin:8px 0 9px}
.lv small{font-size:12px}
.jr{padding:12px 6px 12px}
.jg{gap:8px 0}
.jb{padding:6px 0 4px;font-size:10.5px}
.jc{width:38px;height:38px;margin-bottom:8px}
.jc svg.i{width:18px;height:18px}
.jc em{font-size:8px}
.jr p{margin-top:10px;font-size:12.5px}
nav{width:min(420px,calc(100% - 28px));padding:4px;bottom:calc(8px + env(safe-area-inset-bottom))}
nav button{font-size:10px;padding:5px 0;gap:2px}
nav svg.i{width:19px;height:19px}
/* ===== equal song rows + nav docked to the screen edge ===== */
.rk2{display:flex;align-items:center}
.rk2 .tag{margin-left:6px;padding:2px 7px;font-size:8.5px;letter-spacing:.6px}
#app{padding-bottom:84px}
nav{bottom:0;left:50%;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
</style>
</head>

function ordered() {
  const pin = SONGS.filter((s) => s.pin);
  const rest = SONGS.filter((s) => !s.pin).sort((a, b) => (b.views || 0) - (a.views || 0));
  return [...pin, ...rest];
}
function drawSongs() {
  const all = ordered();
  const views = (s) => (s.views ? `▶ ${fmt(s.views)} views` : '');
  const url = (s) => s.spotify || ARTIST;
  $('#songs').innerHTML = `<div class="two">${all.map((s, i) => `<div class="card sg"><div class="cv"><img src="${s.cover}" alt="${esc(s.title)}"></div><div class="tx"><span class="rk2">#${i + 1}${s.isNew ? '<span class="tag">NEW</span>' : ''}</span><b>${esc(s.title)}</b><div class="vw">${views(s)}</div></div><a class="go" ${link(url(s))}>Stream ${ico('chev')}</a></div>`).join('')}</div>`;
}
function drawRest() {
  $('#all').href = ARTIST;
  $('#plats').innerHTML = PLATFORMS.map((p) => `<a class="card pf ${ok(p.url) ? 'on' : 'off'}" ${link(p.url)}><div class="ic">${ico(p.icon)}</div><b>${esc(p.name)}</b>${p.kr ? `<small>${esc(p.kr)}</small>` : ''}<span class="s">${ok(p.url) ? 'Stream ›' : 'Coming soon'}</span></a>`).join('');
  $('#events').innerHTML = EVENTS.map((e) => `<div class="card ev"><div class="ic">${ico(e.icon)}</div><div class="tx"><b>${esc(e.name)}</b><p>${esc(e.sub)}</p></div><a class="go" ${link(e.url)}>${ok(e.url) ? 'Join' : 'Soon'}</a></div>`).join('');
  const pct = ME.next ? Math.min(100, (ME.exp / ME.next) * 100) : 100;
  $('#level').innerHTML = `<div class="card lv"><div class="t"><b>LV.${ME.level}</b><span>${ME.exp} / ${ME.next ?? '—'} XP</span></div><div class="bar"><i style="width:${pct}%"></i></div><small>Every stream counts for Mark ♡</small></div>`;
  const J = ['paw', 'headphones', 'bolt', 'note', 'sun', 'flame', 'mega', 'chart', 'crown', 'crown'];
  $('#journey').innerHTML = `<div class="sh" style="margin:22px 0 12px"><h2>Level Journey</h2></div><div class="card jr"><div class="jg">${J.map((n, i) => `<div class="jb ${i + 1 === ME.level ? 'on' : ''}"><div class="jc">${ico(n)}<em>${i + 1}</em></div>LV.${i + 1}</div>`).join('')}</div><p>From little cub to chart king</p></div>`;
}
drawSongs(); drawRest();

// real view counts: needs api/stats.js deployed + YT_API_KEY on Vercel. Fails quietly otherwise.
fetch('/api/stats').then((r) => (r.ok ? r.json() : null)).then((d) => {
  if (!d || !d.views) return;
  SONGS.forEach((s) => { if (d.views[s.id] != null) s.views = d.views[s.id]; });
  drawSongs();
}).catch(() => {});

document.querySelectorAll('nav [data-soon]').forEach((b) => b.addEventListener('click', () => {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = 'หน้านี้ยังไม่เปิด'; document.body.append(t); setTimeout(() => t.remove(), 1800);
}));
</script>
</body>
</html>
